<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    overflow: hidden;
    user-select: none;
  }

  /* 背景粒子 */
  .bg-particle {
    position: fixed;
    border-radius: 50%;
    background: rgba(100, 200, 255, 0.06);
    pointer-events: none;
    animation: float linear infinite;
  }
  @keyframes float {
    0%   { transform: translateY(100vh) scale(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  .game-wrapper {
    position: relative;
    background: linear-gradient(135deg, #111133 0%, #0d0d28 50%, #111133 100%);
    border-radius: 24px;
    padding: 24px;
    box-shadow:
      0 0 60px rgba(80, 120, 255, 0.15),
      0 0 120px rgba(80, 120, 255, 0.05),
      inset 0 1px 0 rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding: 0 4px;
  }

  .title {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, #4ade80, #22d3ee);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
  }

  .scores {
    display: flex;
    gap: 24px;
  }
  .score-item {
    text-align: center;
  }
  .score-label {
    font-size: 11px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }
  .score-value {
    font-size: 24px;
    font-weight: 700;
    color: #e2e8f0;
    font-variant-numeric: tabular-nums;
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  }
  .score-value.best {
    color: #fbbf24;
  }

  canvas {
    display: block;
    border-radius: 12px;
    background: #0a0a1f;
    box-shadow:
      inset 0 0 40px rgba(0,0,0,0.5),
      0 0 0 1px rgba(255,255,255,0.04);
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .key-hint {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #555;
  }
  .key-badge {
    display: inline-block;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
    color: #888;
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    min-width: 24px;
    text-align: center;
  }

  /* 游戏结束遮罩 */
  .overlay {
    position: absolute;
    inset: 24px;
    border-radius: 12px;
    background: rgba(0,0,0,0.75);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .overlay-title {
    font-size: 36px;
    font-weight: 700;
    color: #f87171;
    letter-spacing: 2px;
  }
  .overlay-score {
    font-size: 18px;
    color: #94a3b8;
  }
  .overlay-score span {
    color: #fbbf24;
    font-weight: 700;
  }
  .btn {
    background: linear-gradient(135deg, #4ade80, #22d3ee);
    border: none;
    border-radius: 12px;
    padding: 12px 36px;
    font-size: 16px;
    font-weight: 600;
    color: #0a0a1a;
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 24px rgba(74, 222, 128, 0.3);
  }
  .btn:active {
    transform: scale(0.96);
  }

  /* 暂停提示 */
  .pause-indicator {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 48px;
    font-weight: 700;
    color: rgba(255,255,255,0.15);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .pause-indicator.visible {
    opacity: 1;
  }

  /* 排行榜按钮 */
  .leaderboard-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    width: 36px;
    height: 36px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    padding: 0;
    line-height: 1;
  }
  .leaderboard-btn:hover {
    background: rgba(255,255,255,0.12);
    transform: scale(1.1);
    box-shadow: 0 0 12px rgba(251, 191, 36, 0.2);
  }

  /* 通关胜利弹窗 */
  .victory-overlay {
    position: absolute;
    inset: 24px;
    border-radius: 12px;
    background: rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 6;
  }
  .victory-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .victory-title {
    font-size: 32px;
    font-weight: 700;
    color: #fbbf24;
    letter-spacing: 2px;
  }
  .victory-stats {
    display: flex;
    gap: 32px;
  }
  .victory-stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .victory-stat-label {
    font-size: 12px;
    color: #94a3b8;
    letter-spacing: 1px;
  }
  .victory-stat-value {
    font-size: 22px;
    font-weight: 700;
    color: #e2e8f0;
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  }
  .victory-input-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .victory-label {
    font-size: 13px;
    color: #94a3b8;
  }
  .victory-input {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 16px;
    color: #e2e8f0;
    text-align: center;
    width: 220px;
    outline: none;
    font-family: 'Microsoft YaHei', sans-serif;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .victory-input:focus {
    border-color: rgba(251, 191, 36, 0.5);
    box-shadow: 0 0 12px rgba(251, 191, 36, 0.15);
  }
  .victory-input::placeholder {
    color: #555;
  }
  .victory-btns {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn-secondary {
    background: rgba(255,255,255,0.08) !important;
    border: 1px solid rgba(255,255,255,0.12) !important;
    color: #94a3b8 !important;
    padding: 10px 20px !important;
    font-size: 13px !important;
  }
  .btn-secondary:hover {
    background: rgba(255,255,255,0.14) !important;
    box-shadow: 0 0 16px rgba(148, 163, 184, 0.15) !important;
  }

  /* 排行榜弹窗 */
  .leaderboard-overlay {
    position: absolute;
    inset: 24px;
    border-radius: 12px;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 7;
    padding: 20px;
  }
  .leaderboard-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .lb-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    flex-shrink: 0;
  }
  .lb-title {
    font-size: 20px;
    font-weight: 700;
    color: #fbbf24;
    letter-spacing: 1px;
  }
  .lb-close {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: #888;
    width: 32px;
    height: 32px;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .lb-close:hover {
    background: rgba(248, 113, 113, 0.2);
    color: #f87171;
  }
  .lb-table-wrap {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
  }
  .lb-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .lb-table thead th {
    color: #666;
    font-weight: 600;
    padding: 8px 6px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    letter-spacing: 1px;
    font-size: 11px;
    position: sticky;
    top: 0;
    background: rgba(0,0,0,0.85);
  }
  .lb-table tbody td {
    padding: 8px 6px;
    text-align: center;
    color: #cbd5e1;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .lb-table tbody tr {
    transition: background 0.15s;
  }
  .lb-table tbody tr:hover {
    background: rgba(255,255,255,0.03);
  }
  .lb-col-rank { width: 40px; }
  .lb-col-name { width: auto; text-align: left !important; }
  .lb-col-time { width: 80px; font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; }
  .lb-col-deaths { width: 50px; color: #666 !important; font-size: 12px; }
  .lb-table tbody tr.rank-1 td { color: #fbbf24; font-weight: 700; }
  .lb-table tbody tr.rank-2 td { color: #94a3b8; font-weight: 600; }
  .lb-table tbody tr.rank-3 td { color: #d49b5f; font-weight: 600; }
  .lb-empty {
    text-align: center;
    color: #555;
    padding: 40px 0;
    font-size: 14px;
  }
  #victoryDeaths { color: #f87171; }

  /* ── 移动端适配 ──────────────────────────────── */
  @media (max-width: 500px) {
    body {
      overflow-y: auto;
      overflow-x: hidden;
      align-items: flex-start;
      padding-top: 8px;
    }
    .game-wrapper {
      padding: 12px;
      border-radius: 16px;
      margin: 0 auto;
    }
    .header {
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }
    .title {
      font-size: 20px;
    }
    .scores {
      gap: 12px;
    }
    .score-value {
      font-size: 18px;
    }
    .score-label {
      font-size: 9px;
    }
    .mode-btn {
      padding: 4px 10px;
      font-size: 11px;
    }
    .leaderboard-btn {
      width: 30px;
      height: 30px;
      font-size: 15px;
    }
    .color-picker {
      margin-bottom: 8px;
      gap: 4px;
    }
    .color-dot {
      width: 18px;
      height: 18px;
    }
    .level-bar {
      margin-bottom: 6px;
      gap: 6px;
      flex-wrap: wrap;
    }
    .level-badge { font-size: 11px; }
    .level-name { font-size: 10px; }
    .level-stat { font-size: 10px; padding-left: 6px; }
    .controls {
      margin-top: 8px;
      gap: 4px;
    }
    .key-hint { font-size: 10px; }
    .key-badge { font-size: 9px; padding: 2px 5px; }
    .btn {
      padding: 8px 24px;
      font-size: 14px;
    }
    .btn-secondary {
      padding: 7px 14px !important;
      font-size: 11px !important;
    }
    .overlay-title { font-size: 24px; }
    .overlay-score { font-size: 14px; }
    .victory-title { font-size: 22px; }
    .victory-stats { gap: 16px; }
    .victory-stat-value { font-size: 18px; }
    .victory-stat-label { font-size: 10px; }
    .victory-input { width: 180px; font-size: 14px; padding: 8px 12px; }
    .victory-btns { gap: 6px; }
    .lb-title { font-size: 16px; }
    .lb-table { font-size: 11px; }
    /* overlay 适配缩小的 padding */
    .overlay { inset: 12px; }
    .level-overlay { inset: 12px; }
    .victory-overlay { inset: 12px; }
    .leaderboard-overlay { inset: 12px; padding: 12px; }
  }

  /* 颜色选择器 */
  .color-picker {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-bottom: 14px;
  }
  .color-picker-label {
    font-size: 11px;
    color: #555;
    letter-spacing: 1px;
    margin-right: 4px;
  }
  .color-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    position: relative;
  }
  .color-dot:hover {
    transform: scale(1.2);
    box-shadow: 0 0 12px currentColor;
  }
  .color-dot.active {
    border-color: #fff;
    box-shadow: 0 0 10px currentColor;
    transform: scale(1.15);
  }
  .color-dot.active::after {
    content: '✓';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 4px rgba(0,0,0,0.6);
  }

  /* 模式切换 */
  .mode-toggle {
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    padding: 3px;
  }
  .mode-btn {
    padding: 5px 14px;
    border-radius: 8px;
    border: none;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    color: #666;
    background: transparent;
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  .mode-btn.active {
    background: rgba(255,255,255,0.1);
    color: #e2e8f0;
    box-shadow: 0 0 8px rgba(100,180,255,0.15);
  }
  .mode-btn:hover:not(.active) {
    color: #999;
  }

  /* 关卡信息栏 */
  .level-bar {
    display: none;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    padding: 0 4px;
  }
  .level-bar.visible { display: flex; }
  .level-badge {
    font-size: 13px;
    font-weight: 700;
    color: #fbbf24;
    white-space: nowrap;
    letter-spacing: 1px;
  }
  .level-name {
    font-size: 12px;
    color: #94a3b8;
    white-space: nowrap;
  }
  .progress-wrap {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.05);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, #4ade80, #fbbf24);
    transition: width 0.3s;
    width: 0%;
  }
  .progress-text {
    font-size: 10px;
    color: #555;
    white-space: nowrap;
    min-width: 50px;
    text-align: right;
  }

  /* 用时 & 死亡实时显示 */
  .level-stat {
    font-size: 12px;
    color: #94a3b8;
    white-space: nowrap;
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    border-left: 1px solid rgba(255,255,255,0.06);
    padding-left: 10px;
  }
  .level-stat #liveTime {
    color: #22d3ee;
  }
  .level-stat #liveDeaths {
    color: #f87171;
  }

  /* 过关 / 胜利遮罩 */
  .level-overlay {
    position: absolute;
    inset: 24px;
    border-radius: 12px;
    background: rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 14px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 5;
  }
  .level-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .level-overlay-title {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .level-overlay-sub {
    font-size: 16px;
    color: #94a3b8;
  }
</style>
</head>
<body>

<!-- 背景粒子 -->
<div id="bg-particles"></div>

<div class="game-wrapper" id="gameWrapper">
  <div class="header">
    <div class="title">🐍 贪吃蛇</div>
    <div class="mode-toggle" id="modeToggle">
      <button class="mode-btn active" data-mode="classic">经典</button>
      <button class="mode-btn" data-mode="level">闯关</button>
    </div>
    <button class="leaderboard-btn" id="leaderboardBtn" title="排行榜">🏆</button>
    <div class="scores">
      <div class="score-item">
        <div class="score-label">得分</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-item">
        <div class="score-label">最高分</div>
        <div class="score-value best" id="bestScore">0</div>
      </div>
      <div class="score-item">
        <div class="score-label">长度</div>
        <div class="score-value" id="length" style="color:#4ade80">3</div>
      </div>
    </div>
  </div>

  <div class="color-picker" id="colorPicker">
    <span class="color-picker-label">蛇皮</span>
  </div>

  <div class="level-bar" id="levelBar">
    <span class="level-badge" id="levelBadge">第 1 / 5 关</span>
    <span class="level-name" id="levelName">初入蛇穴</span>
    <div class="progress-wrap">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span class="progress-text" id="progressText">0 / 50</span>
    <span class="level-stat">⏱ <span id="liveTime">0秒</span></span>
    <span class="level-stat">💀 <span id="liveDeaths">0</span></span>
  </div>

  <div style="position:relative;">
    <canvas id="canvas"></canvas>
    <div class="overlay" id="overlay">
      <div class="overlay-title" id="overlayTitle">游戏结束</div>
      <div class="overlay-score">得分: <span id="overlayScore">0</span></div>
      <button class="btn" id="restartBtn">🔄 再来一局</button>
    </div>
    <div class="level-overlay" id="levelOverlay">
      <div class="level-overlay-title" id="lvlOverlayTitle" style="color:#4ade80;">🎉 通关！</div>
      <div class="level-overlay-sub" id="lvlOverlaySub"></div>
      <button class="btn" id="lvlNextBtn">▶ 下一关</button>
    </div>
    <div class="pause-indicator" id="pauseIndicator">⏸ 暂停</div>
    <div class="victory-overlay" id="victoryOverlay">
      <div class="victory-title">🏆 全部通关！</div>
      <div class="victory-stats">
        <div class="victory-stat">
          <span class="victory-stat-label">⏱ 总用时</span>
          <span class="victory-stat-value" id="victoryTime">0秒</span>
        </div>
        <div class="victory-stat">
          <span class="victory-stat-label">💀 死亡次数</span>
          <span class="victory-stat-value" id="victoryDeaths">0</span>
        </div>
      </div>
      <div class="victory-input-wrap">
        <label class="victory-label">留下你的昵称 ✍️</label>
        <input type="text" class="victory-input" id="victoryNickname" maxlength="12" placeholder="输入昵称（最多12字）" autocomplete="off">
      </div>
      <div class="victory-btns">
        <button class="btn" id="victorySubmitBtn">📋 提交记录</button>
        <button class="btn btn-secondary" id="victoryLeaderboardBtn">🏆 查看排行榜</button>
        <button class="btn btn-secondary" id="victoryRetryBtn">🔄 重新挑战</button>
      </div>
    </div>
    <div class="leaderboard-overlay" id="leaderboardOverlay">
      <div class="lb-header">
        <span class="lb-title">🏆 通关排行榜</span>
        <button class="lb-close" id="lbCloseBtn">✕</button>
      </div>
      <div class="lb-table-wrap">
        <table class="lb-table" id="lbTable">
          <thead>
            <tr>
              <th class="lb-col-rank">#</th>
              <th class="lb-col-name">昵称</th>
              <th class="lb-col-time">用时</th>
              <th class="lb-col-deaths">死亡</th>
            </tr>
          </thead>
          <tbody id="lbTbody">
          </tbody>
        </table>
        <div class="lb-empty" id="lbEmpty">暂无通关记录，快来挑战吧！</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <span class="key-hint"><span class="key-badge">↑↓←→</span> 或</span>
    <span class="key-hint"><span class="key-badge">W A S D</span> 移动</span>
    <span class="key-hint"><span class="key-badge">Space</span> 暂停</span>
    <span class="key-hint"><span class="key-badge">R</span> 重新开始</span>
  </div>
</div>

<script>
(function() {
  // ── DOM ──────────────────────────────────────────
  const canvas   = document.getElementById('canvas');
  const ctx      = canvas.getContext('2d');
  const scoreEl  = document.getElementById('score');
  const bestEl   = document.getElementById('bestScore');
  const lengthEl = document.getElementById('length');
  const overlay  = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayScore = document.getElementById('overlayScore');
  const pauseInd   = document.getElementById('pauseIndicator');
  const restartBtn = document.getElementById('restartBtn');

  // 关卡模式 DOM
  const levelBar     = document.getElementById('levelBar');
  const levelBadge   = document.getElementById('levelBadge');
  const levelNameEl  = document.getElementById('levelName');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const levelOverlay = document.getElementById('levelOverlay');
  const lvlOverlayTitle = document.getElementById('lvlOverlayTitle');
  const lvlOverlaySub   = document.getElementById('lvlOverlaySub');
  const lvlNextBtn      = document.getElementById('lvlNextBtn');
  const modeBtns     = document.querySelectorAll('.mode-btn');

  // 通关 & 排行榜 DOM
  const victoryOverlay     = document.getElementById('victoryOverlay');
  const victoryTime        = document.getElementById('victoryTime');
  const victoryDeaths      = document.getElementById('victoryDeaths');
  const victoryNickname    = document.getElementById('victoryNickname');
  const victorySubmitBtn   = document.getElementById('victorySubmitBtn');
  const victoryLeaderboardBtn = document.getElementById('victoryLeaderboardBtn');
  const victoryRetryBtn    = document.getElementById('victoryRetryBtn');
  const leaderboardOverlay = document.getElementById('leaderboardOverlay');
  const lbTbody            = document.getElementById('lbTbody');
  const lbEmpty            = document.getElementById('lbEmpty');
  const lbCloseBtn         = document.getElementById('lbCloseBtn');
  const leaderboardBtn     = document.getElementById('leaderboardBtn');
  const liveTimeEl         = document.getElementById('liveTime');
  const liveDeathsEl       = document.getElementById('liveDeaths');

  // ── 常量 ─────────────────────────────────────────
  let   CELL   = 24;          // 每格像素（响应式，会根据屏幕调整）
  const COLS   = 24;          // 列数
  const ROWS   = 24;          // 行数
  let   WIDTH  = COLS * CELL;
  let   HEIGHT = ROWS * CELL;

  function applyCanvasSize() {
    WIDTH  = COLS * CELL;
    HEIGHT = ROWS * CELL;
    canvas.width  = WIDTH;
    canvas.height = HEIGHT;
  }

  applyCanvasSize();

  // ── 游戏状态 ─────────────────────────────────────
  let snake    = [];
  let food     = null;
  let special  = null;       // 特殊食物（加分）
  let specialTimer = 0;
  let dir      = { x: 1, y: 0 };
  let nextDir  = { x: 1, y: 0 };
  let score    = 0;
  let highScore = 0;
  let gameOver = false;
  let paused   = false;
  let speed    = 130;        // ms/步 — 初始速度
  let tickAcc  = 0;
  let lastTime = 0;
  let particles = [];
  let trailPositions = [];   // 用于蛇身渐变
  let growing  = false;
  let growCount = 0;
  let frameCount = 0;
  let gameTime   = 0;        // 闯关模式累计游戏时长（毫秒）
  let deathCount = 0;        // 闯关模式死亡次数

  // 从 localStorage 读取最高分
  try {
    const saved = localStorage.getItem('snake-high-score');
    if (saved) highScore = parseInt(saved, 10) || 0;
  } catch(e) {}

  // ── 颜色主题 ─────────────────────────────────────
  const THEMES = [
    { name: 'green',  label: '翠绿', head: [34, 197, 94],  tail: [20, 120, 50],   glow: [74, 222, 128] },
    { name: 'blue',   label: '海蓝', head: [59, 130, 246], tail: [30, 64, 140],    glow: [96, 165, 250]  },
    { name: 'purple', label: '星紫', head: [168, 85, 247], tail: [90, 40, 140],    glow: [192, 132, 252] },
    { name: 'pink',   label: '桃粉', head: [244, 114, 182],tail: [150, 50, 100],   glow: [244, 114, 182] },
    { name: 'orange', label: '赤橙', head: [251, 146, 60], tail: [160, 70, 20],    glow: [251, 146, 60]  },
    { name: 'gold',   label: '耀金', head: [250, 204, 21], tail: [150, 110, 10],   glow: [250, 204, 21]  },
    { name: 'cyan',   label: '冰青', head: [34, 211, 238], tail: [15, 110, 130],   glow: [34, 211, 238]  },
    { name: 'red',    label: '赤红', head: [248, 113, 113],tail: [150, 40, 40],    glow: [248, 113, 113] },
  ];
  let currentTheme = THEMES[0]; // 默认绿色

  // 从 localStorage 读取颜色主题
  try {
    const savedTheme = localStorage.getItem('snake-color-theme');
    if (savedTheme) {
      const found = THEMES.find(t => t.name === savedTheme);
      if (found) currentTheme = found;
    }
  } catch(e) {}

  // ── 闯关模式状态 ─────────────────────────────────
  let gameMode     = 'classic';  // 'classic' | 'level'
  let currentLevel = 1;
  let levelStartScore = 0;       // 进入当前关时的累积分数
  let obstacles    = [];
  let levelTransition = false;   // 过关动画中
  let countdownRemaining = 0;    // 倒计时剩余毫秒，0=不在倒计时

  // ── 障碍物生成工具 ───────────────────────────────
  function hLine(x, y, len) {
    const pts = [];
    for (let i = 0; i < len; i++) pts.push({x: x + i, y});
    return pts;
  }
  function vLine(x, y, len) {
    const pts = [];
    for (let i = 0; i < len; i++) pts.push({x, y: y + i});
    return pts;
  }
  function rectObs(x, y, w, h) {
    const pts = [];
    for (let dx = 0; dx < w; dx++)
      for (let dy = 0; dy < h; dy++)
        pts.push({x: x + dx, y: y + dy});
    return pts;
  }
  // 去重
  function dedupe(pts) {
    const seen = new Set();
    return pts.filter(p => {
      const k = `${p.x},${p.y}`;
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });
  }

  // ── 关卡定义（障碍物 + 目标分数 + 速度）──────────
  // 蛇出生点：中心 (12,12), (11,12), (10,12)，避开此区域
  const LEVELS = [
    { // 第 1 关
      name: '初入蛇穴', target: 50, speed: 130,
      obstacles: dedupe([].concat(
        vLine(18, 4, 16),                // 右侧竖墙
        hLine(3, 8, 6),                   // 左上短横
        hLine(15, 8, 5),                  // 右上短横
        hLine(3, 16, 6),                  // 左下短横
        hLine(15, 16, 5),                 // 右下短横
      ))
    },
    { // 第 2 关
      name: '曲折前进', target: 120, speed: 115,
      obstacles: dedupe([].concat(
        // 四角 L 形
        vLine(3, 3, 7), hLine(3, 3, 7),
        vLine(20, 3, 7), hLine(14, 3, 7),
        vLine(3, 14, 7), hLine(3, 17, 7),
        vLine(20, 14, 7), hLine(14, 17, 7),
        // 中间分散方块
        rectObs(10, 7, 4, 1), rectObs(10, 16, 4, 1),
        rectObs(7, 11, 1, 2), rectObs(16, 11, 1, 2),
      ))
    },
    { // 第 3 关
      name: '迷宫探险', target: 210, speed: 100,
      obstacles: dedupe([].concat(
        // 上下横墙
        hLine(3, 3, 9), hLine(12, 3, 9),
        hLine(3, 20, 9), hLine(12, 20, 9),
        // 左右竖墙
        vLine(3, 5, 6), vLine(3, 13, 6),
        vLine(20, 5, 6), vLine(20, 13, 6),
        // 中央回廊
        hLine(8, 10, 8), hLine(8, 13, 8),
        vLine(10, 10, 4),
        // 四个角落小方块
        rectObs(0, 0, 3, 1), rectObs(21, 0, 3, 1),
        rectObs(0, 23, 3, 1), rectObs(21, 23, 3, 1),
      ))
    },
    { // 第 4 关
      name: '步步惊心', target: 320, speed: 85,
      obstacles: dedupe([].concat(
        // 外圈边框片段（不是完整边框）
        hLine(2, 2, 8), hLine(14, 2, 8),
        hLine(2, 21, 8), hLine(14, 21, 8),
        vLine(2, 4, 6), vLine(2, 14, 6),
        vLine(21, 4, 6), vLine(21, 14, 6),
        // 内部密集区
        hLine(5, 8, 5), hLine(14, 8, 5),
        hLine(5, 15, 5), hLine(14, 15, 5),
        vLine(8, 5, 5), vLine(8, 14, 5),
        vLine(15, 5, 5), vLine(15, 14, 5),
        // 中心小环
        rectObs(10, 11, 4, 2),
        rectObs(9, 9, 1, 6), rectObs(14, 9, 1, 6),
      ))
    },
    { // 第 5 关
      name: '终极挑战', target: 450, speed: 70,
      obstacles: dedupe([].concat(
        // 全屏锯齿边框
        hLine(1, 1, 7), hLine(9, 1, 6), hLine(16, 1, 7),
        hLine(1, 22, 7), hLine(9, 22, 6), hLine(16, 22, 7),
        vLine(1, 3, 6), vLine(1, 10, 4), vLine(1, 15, 6),
        vLine(22, 3, 6), vLine(22, 10, 4), vLine(22, 15, 6),
        // 内部迷宫
        hLine(4, 5, 4), hLine(16, 5, 4),
        hLine(4, 18, 4), hLine(16, 18, 4),
        vLine(5, 7, 4), vLine(5, 13, 4),
        vLine(18, 7, 4), vLine(18, 13, 4),
        // 中心多重障碍
        hLine(7, 11, 3), hLine(14, 11, 3),
        rectObs(10, 7, 4, 2), rectObs(10, 15, 4, 2),
        rectObs(8, 10, 2, 4), rectObs(14, 10, 2, 4),
        // 角落封堵
        rectObs(2, 2, 4, 2), rectObs(18, 2, 4, 2),
        rectObs(2, 20, 4, 2), rectObs(18, 20, 4, 2),
      ))
    },
  ];

  // ── 工具函数 ─────────────────────────────────────
  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function gridPos() {
    return {
      x: randInt(0, COLS - 1),
      y: randInt(0, ROWS - 1)
    };
  }

  function occupies(pos) {
    if (snake.some(s => s.x === pos.x && s.y === pos.y)) return true;
    if (obstacles.some(o => o.x === pos.x && o.y === pos.y)) return true;
    return false;
  }

  function spawnFood() {
    let pos;
    do { pos = gridPos(); } while (occupies(pos));
    return { ...pos, pulse: 0 };
  }

  function spawnSpecial() {
    let pos;
    do { pos = gridPos(); } while (occupies(pos) || (food && pos.x === food.x && pos.y === food.y));
    return { ...pos, life: 80 }; // 80 帧 ≈ 5秒 (60fps ≈ 1.3s, 但游戏帧率低)
  }

  // ── 粒子系统 ─────────────────────────────────────
  function emitParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
      const speed = 1.5 + Math.random() * 3;
      particles.push({
        x: x * CELL + CELL / 2,
        y: y * CELL + CELL / 2,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.02 + Math.random() * 0.04,
        color: color,
        size: 2 + Math.random() * 3
      });
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawParticles(ctx) {
    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // ── 重置 ─────────────────────────────────────────
  function reset() {
    const midX = Math.floor(COLS / 2);
    const midY = Math.floor(ROWS / 2);
    snake = [
      { x: midX, y: midY },
      { x: midX - 1, y: midY },
      { x: midX - 2, y: midY }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    gameOver = false;
    paused = false;
    growing = false;
    growCount = 0;
    particles = [];
    special = null;
    specialTimer = 0;
    tickAcc = 0;

    if (gameMode === 'level') {
      const lvl = LEVELS[currentLevel - 1];
      speed = lvl.speed;
      obstacles = lvl.obstacles;
      score = levelStartScore;
      levelTransition = false;

      scoreEl.textContent = score;
      lengthEl.textContent = snake.length;
      overlay.classList.remove('active');
      levelOverlay.classList.remove('active');
      pauseInd.classList.remove('visible');
      updateLevelUI();
      countdownRemaining = 3000;
      food = spawnFood();
    } else {
      score = 0;
      speed = 130;
      obstacles = [];
      levelTransition = false;
      countdownRemaining = 0;

      scoreEl.textContent = '0';
      lengthEl.textContent = snake.length;
      overlay.classList.remove('active');
      levelOverlay.classList.remove('active');
      pauseInd.classList.remove('visible');
      food = spawnFood();
    }
  }

  function die() {
    gameOver = true;
    if (score > highScore) {
      highScore = score;
      try { localStorage.setItem('snake-high-score', highScore); } catch(e) {}
      bestEl.textContent = highScore;
      overlayTitle.textContent = '🏆 新纪录!';
    } else {
      overlayTitle.textContent = '游戏结束';
    }
    overlayScore.textContent = score;
    overlay.classList.add('active');

    // 关卡模式：重开按钮文字改为"重试本关"
    if (gameMode === 'level') {
      deathCount++;
      restartBtn.textContent = '🔄 重试本关';
    } else {
      restartBtn.textContent = '🔄 再来一局';
    }
  }

  // ── 输入处理 ─────────────────────────────────────
  document.addEventListener('keydown', e => {
    // 排行榜弹窗显示时优先处理（层级最高）
    if (leaderboardOverlay.classList.contains('active')) {
      if (e.key === 'Escape') {
        hideLeaderboard();
      }
      return;
    }

    // 胜利弹窗显示时忽略大部分输入
    if (victoryOverlay.classList.contains('active')) {
      if (e.key === 'Enter') {
        victorySubmitBtn.click();
      }
      return;
    }

    // 关卡过渡中忽略输入
    if (levelTransition && levelOverlay.classList.contains('active')) {
      if (e.key === 'Enter') {
        lvlNextBtn.click();
      }
      return;
    }

    if (gameOver) {
      if (e.key === 'r' || e.key === 'R' || e.key === 'Enter') {
        if (gameMode === 'level') {
          score = levelStartScore;
          scoreEl.textContent = score;
        }
        reset();
      }
      return;
    }

    switch (e.key) {
      case 'ArrowUp':    case 'w': case 'W':
        if (dir.y !== 1) nextDir = { x: 0, y: -1 };
        e.preventDefault();
        break;
      case 'ArrowDown':  case 's': case 'S':
        if (dir.y !== -1) nextDir = { x: 0, y: 1 };
        e.preventDefault();
        break;
      case 'ArrowLeft':  case 'a': case 'A':
        if (dir.x !== 1) nextDir = { x: -1, y: 0 };
        e.preventDefault();
        break;
      case 'ArrowRight': case 'd': case 'D':
        if (dir.x !== -1) nextDir = { x: 1, y: 0 };
        e.preventDefault();
        break;
      case ' ':
        paused = !paused;
        pauseInd.classList.toggle('visible', paused);
        e.preventDefault();
        break;
      case 'r': case 'R':
        if (gameMode === 'level') {
          score = levelStartScore;
          scoreEl.textContent = score;
        }
        reset();
        e.preventDefault();
        break;
    }
  });

  restartBtn.addEventListener('click', () => {
    if (gameMode === 'level') {
      // 关卡模式：重置到当前关卡的初始分数
      score = levelStartScore;
      scoreEl.textContent = score;
    }
    reset();
  });

  // ── 更新逻辑 ─────────────────────────────────────
  function update(dt) {
    if (gameOver || paused) return;

    // 倒计时中：更新计时器但不移动蛇
    if (countdownRemaining > 0) {
      countdownRemaining -= dt;
      if (countdownRemaining < 0) countdownRemaining = 0;
      tickAcc = 0; // 防止倒计时结束后瞬间跳帧
      updateParticles();
      if (food) food.pulse = (food.pulse + 0.08) % (Math.PI * 2);
      return;
    }

    // 闯关模式累加游戏时间
    if (gameMode === 'level') {
      gameTime += dt;
    }

    tickAcc += dt;
    while (tickAcc >= speed) {
      tickAcc -= speed;
      step();
    }

    // 更新粒子
    updateParticles();

    // 更新食物脉冲动画
    if (food) food.pulse = (food.pulse + 0.08) % (Math.PI * 2);

    // 特殊食物计时
    if (special) {
      special.life--;
      if (special.life <= 0) {
        special = null;
        specialTimer = 200; // 冷却 (游戏步数)
      }
    }
    if (!special && specialTimer > 0) {
      specialTimer--;
      if (specialTimer === 0 && Math.random() < 0.3) {
        special = spawnSpecial();
      }
    }
    if (!special && specialTimer === 0) {
      specialTimer = 1; // 触发一次尝试
    }

    frameCount++;
  }

  function step() {
    // 应用方向
    dir = { ...nextDir };

    // 新头部
    const head = {
      x: snake[0].x + dir.x,
      y: snake[0].y + dir.y
    };

    // 边界回绕 — 穿墙从另一侧出现
    if (head.x < 0) head.x = COLS - 1;
    if (head.x >= COLS) head.x = 0;
    if (head.y < 0) head.y = ROWS - 1;
    if (head.y >= ROWS) head.y = 0;

    // 撞障碍物检测
    if (obstacles.some(o => o.x === head.x && o.y === head.y)) {
      emitParticles(head.x, head.y, '#ef4444', 20);
      die();
      return;
    }

    // 撞自己检测
    if (snake.some((s, i) => i < snake.length - 1 && s.x === head.x && s.y === head.y)) {
      emitParticles(head.x, head.y, '#f87171', 20);
      die();
      return;
    }

    // 插入头部
    snake.unshift(head);

    // 吃普通食物
    let ate = false;
    if (food && head.x === food.x && head.y === food.y) {
      ate = true;
      score += 10;
      growing = true;
      growCount += 1;
      emitParticles(food.x, food.y, `rgb(${currentTheme.glow.join(',')})`, 12);
      food = spawnFood();

      // 加速（经典模式）
      if (gameMode === 'classic' && speed > 60) {
        speed = Math.max(60, speed - 2);
      }

      scoreEl.textContent = score;
      lengthEl.textContent = snake.length;

      // 关卡模式：检查是否过关
      if (gameMode === 'level') {
        updateLevelUI();
        const lvl = LEVELS[currentLevel - 1];
        if (score - levelStartScore >= lvl.target) {
          completeLevel();
          return;
        }
      }
    }

    // 吃特殊食物
    if (special && head.x === special.x && head.y === special.y) {
      score += 30;
      growing = true;
      growCount += 2;
      emitParticles(special.x, special.y, '#fbbf24', 18);
      special = null;
      specialTimer = 150;

      scoreEl.textContent = score;
      lengthEl.textContent = snake.length;

      // 关卡模式：检查是否过关
      if (gameMode === 'level') {
        updateLevelUI();
        const lvl = LEVELS[currentLevel - 1];
        if (score - levelStartScore >= lvl.target) {
          completeLevel();
          return;
        }
      }
    }

    // 尾部处理
    if (growing) {
      if (growCount > 0) {
        growCount--;
      }
      if (growCount === 0) {
        growing = false;
      }
    } else {
      snake.pop();
    }

    lengthEl.textContent = snake.length;
  }

  // ── 渲染 ─────────────────────────────────────────
  function drawGrid() {
    ctx.strokeStyle = 'rgba(255,255,255,0.015)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath();
      ctx.moveTo(x * CELL, 0);
      ctx.lineTo(x * CELL, HEIGHT);
      ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * CELL);
      ctx.lineTo(WIDTH, y * CELL);
      ctx.stroke();
    }
  }

  function drawFood() {
    if (!food) return;
    const fx = food.x * CELL + CELL / 2;
    const fy = food.y * CELL + CELL / 2;
    const pulse = 1 + Math.sin(food.pulse) * 0.15;

    // 光晕
    const glow = ctx.createRadialGradient(fx, fy, CELL * 0.15, fx, fy, CELL * 0.65 * pulse);
    glow.addColorStop(0, 'rgba(248, 113, 113, 0.35)');
    glow.addColorStop(1, 'rgba(248, 113, 113, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(fx - CELL*0.7, fy - CELL*0.7, CELL*1.4, CELL*1.4);

    // 食物本体 — 小苹果形状
    const r = CELL * 0.35 * pulse;
    ctx.fillStyle = '#f87171';
    ctx.shadowColor = '#f87171';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(fx, fy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // 高光
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.arc(fx - r*0.3, fy - r*0.3, r*0.35, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSpecialFood() {
    if (!special) return;
    const sx = special.x * CELL + CELL / 2;
    const sy = special.y * CELL + CELL / 2;
    const alpha = special.life < 20 ? special.life / 20 : 1;

    ctx.save();
    ctx.globalAlpha = alpha;

    // 光晕
    const glow = ctx.createRadialGradient(sx, sy, CELL * 0.1, sx, sy, CELL * 0.7);
    glow.addColorStop(0, 'rgba(251, 191, 36, 0.4)');
    glow.addColorStop(1, 'rgba(251, 191, 36, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(sx - CELL*0.7, sy - CELL*0.7, CELL*1.4, CELL*1.4);

    // 星星形状
    const spikes = 5;
    const outerR = CELL * 0.4;
    const innerR = CELL * 0.18;
    ctx.fillStyle = '#fbbf24';
    ctx.shadowColor = '#fbbf24';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    for (let i = 0; i < spikes * 2; i++) {
      const r = i % 2 === 0 ? outerR : innerR;
      const angle = (Math.PI * 2 * i) / (spikes * 2) - Math.PI / 2;
      const px = sx + Math.cos(angle) * r;
      const py = sy + Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.restore();
  }

  function drawSnake() {
    if (snake.length === 0) return;

    const [hr, hg, hb] = currentTheme.head;
    const [tr, tg, tb] = currentTheme.tail;

    // 身体渐变 — 从头部亮色到尾部暗色
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const t = i / Math.max(snake.length - 1, 1); // 0=头, 1=尾
      const cx = s.x * CELL;
      const cy = s.y * CELL;

      // 颜色插值
      const r = Math.floor(hr + t * (tr - hr));
      const g = Math.floor(hg + t * (tg - hg));
      const b = Math.floor(hb + t * (tb - hb));
      const alpha = 1 - t * 0.5;

      ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;

      // 圆角矩形
      const pad = i === 0 ? 1 : 2;
      const radius = i === 0 ? 7 : 5;
      roundRect(cx + pad, cy + pad, CELL - pad * 2, CELL - pad * 2, radius);
      ctx.fill();
    }

    // 头部光晕
    const head = snake[0];
    const hx = head.x * CELL + CELL / 2;
    const hy = head.y * CELL + CELL / 2;
    const [glowR, glowG, glowB] = currentTheme.glow;
    const hGlow = ctx.createRadialGradient(hx, hy, CELL * 0.2, hx, hy, CELL * 0.8);
    hGlow.addColorStop(0, `rgba(${glowR},${glowG},${glowB},0.3)`);
    hGlow.addColorStop(1, `rgba(${glowR},${glowG},${glowB},0)`);
    ctx.fillStyle = hGlow;
    ctx.fillRect(hx - CELL, hy - CELL, CELL * 2, CELL * 2);

    // 眼睛
    drawEyes(head);
  }

  function drawEyes(head) {
    const cx = head.x * CELL + CELL / 2;
    const cy = head.y * CELL + CELL / 2;
    const eyeR = 3;

    // 根据方向调整眼睛位置
    let e1x, e1y, e2x, e2y;
    const offset = 5;
    if (dir.x === 1) {       // 右
      e1x = cx + offset; e1y = cy - 4;
      e2x = cx + offset; e2y = cy + 4;
    } else if (dir.x === -1) { // 左
      e1x = cx - offset; e1y = cy - 4;
      e2x = cx - offset; e2y = cy + 4;
    } else if (dir.y === -1) { // 上
      e1x = cx - 4; e1y = cy - offset;
      e2x = cx + 4; e2y = cy - offset;
    } else {                   // 下
      e1x = cx - 4; e1y = cy + offset;
      e2x = cx + 4; e2y = cy + offset;
    }

    // 白色眼球
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(e1x, e1y, eyeR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(e2x, e2y, eyeR, 0, Math.PI * 2);
    ctx.fill();

    // 黑色瞳孔
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(e1x + dir.x * 1.2, e1y + dir.y * 1.2, 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(e2x + dir.x * 1.2, e2y + dir.y * 1.2, 1.8, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawObstacles() {
    for (const o of obstacles) {
      const ox = o.x * CELL;
      const oy = o.y * CELL;
      const m = 1; // margin

      // 石块主体
      const grad = ctx.createLinearGradient(ox, oy, ox, oy + CELL);
      grad.addColorStop(0, '#3d3d5c');
      grad.addColorStop(0.5, '#2a2a40');
      grad.addColorStop(1, '#1a1a30');
      ctx.fillStyle = grad;
      roundRect(ox + m, oy + m, CELL - m * 2, CELL - m * 2, 3);
      ctx.fill();

      // 顶部高光边
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(ox + m + 3, oy + m);
      ctx.lineTo(ox + CELL - m - 3, oy + m);
      ctx.stroke();

      // 内部纹理裂痕
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(ox + 5, oy + 7);
      ctx.lineTo(ox + 10, oy + 14);
      ctx.stroke();
    }
  }

  function drawParticlesOnCanvas() {
    drawParticles(ctx);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function render() {
    updateLiveStats();
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    drawGrid();
    drawObstacles();
    drawSpecialFood();
    drawFood();
    drawSnake();
    drawParticlesOnCanvas();

    // 倒计时显示
    if (countdownRemaining > 0 && gameMode === 'level') {
      const sec = Math.ceil(countdownRemaining / 1000);
      const alpha = (countdownRemaining % 1000) / 1000; // 渐隐
      const scale = 1 + (1 - alpha) * 0.3; // 从 1.0 放大到 1.3

      ctx.save();
      ctx.globalAlpha = 0.6 * (alpha * 0.5 + 0.5);
      ctx.fillStyle = '#0a0a1f';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.globalAlpha = Math.min(1, alpha + 0.3);
      ctx.fillStyle = '#fbbf24';
      ctx.font = `bold ${Math.floor(72 * scale)}px "Microsoft YaHei", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = '#fbbf24';
      ctx.shadowBlur = 20;
      ctx.fillText(sec, WIDTH / 2, HEIGHT / 2);
      ctx.restore();
    }

    // 游戏结束时的红色闪烁
    if (gameOver) {
      ctx.fillStyle = 'rgba(248, 113, 113, 0.06)';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
    }
  }

  // ── 游戏循环 ─────────────────────────────────────
  function gameLoop(timestamp) {
    if (lastTime === 0) lastTime = timestamp;
    let dt = timestamp - lastTime;
    lastTime = timestamp;

    // 防止 tab 切换后的大帧跳跃
    if (dt > 500) dt = 500;

    update(dt);
    render();

    requestAnimationFrame(gameLoop);
  }

  // ── 创建背景粒子 ─────────────────────────────────
  function createBgParticles() {
    const container = document.getElementById('bg-particles');
    for (let i = 0; i < 30; i++) {
      const particle = document.createElement('div');
      particle.className = 'bg-particle';
      const size = 2 + Math.random() * 4;
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDuration = (8 + Math.random() * 20) + 's';
      particle.style.animationDelay = Math.random() * 15 + 's';
      container.appendChild(particle);
    }
  }

  // ── 关卡模式逻辑 ─────────────────────────────────
  function updateLevelUI() {
    const lvl = LEVELS[currentLevel - 1];
    const earned = score - levelStartScore;
    const pct = Math.min(100, Math.round((earned / lvl.target) * 100));
    levelBadge.textContent = `第 ${currentLevel} / ${LEVELS.length} 关`;
    levelNameEl.textContent = lvl.name;
    progressFill.style.width = pct + '%';
    progressText.textContent = earned + ' / ' + lvl.target;
  }

  function updateLiveStats() {
    if (gameMode === 'level') {
      liveTimeEl.textContent = formatDuration(gameTime);
      liveDeathsEl.textContent = deathCount;
    }
  }

  function startLevel(n) {
    currentLevel = n;
    const lvl = LEVELS[n - 1];
    obstacles = lvl.obstacles;
    speed = lvl.speed;
    levelStartScore = score;
    levelTransition = false;
    levelOverlay.classList.remove('active');
    updateLevelUI();
    resetSnakeOnly();
    countdownRemaining = 3000; // 3 秒倒计时
  }

  function resetSnakeOnly() {
    const midX = Math.floor(COLS / 2);
    const midY = Math.floor(ROWS / 2);
    snake = [
      { x: midX, y: midY },
      { x: midX - 1, y: midY },
      { x: midX - 2, y: midY }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    growing = false;
    growCount = 0;
    particles = [];
    special = null;
    specialTimer = 0;
    tickAcc = 0;
    food = spawnFood();
    lengthEl.textContent = snake.length;
    scoreEl.textContent = score;
    paused = false;
    gameOver = false;
    pauseInd.classList.remove('visible');
  }

  function completeLevel() {
    levelTransition = true;
    paused = true;
    countdownRemaining = 0;
    if (currentLevel >= LEVELS.length) {
      // 全部通关！
      if (score > highScore) {
        highScore = score;
        try { localStorage.setItem('snake-high-score', highScore); } catch(e) {}
        bestEl.textContent = highScore;
      }
      // 显示胜利弹窗
      victoryTime.textContent = formatDuration(gameTime);
      victoryDeaths.textContent = deathCount;
      victoryNickname.value = '';
      victoryOverlay.classList.add('active');
    } else {
      lvlOverlayTitle.textContent = '🎉 第 ' + currentLevel + ' 关通过！';
      lvlOverlayTitle.style.color = '#4ade80';
      lvlOverlaySub.textContent = '得分: ' + score + '  |  准备进入第 ' + (currentLevel + 1) + ' 关';
      lvlNextBtn.textContent = '▶ 进入下一关';
      lvlNextBtn.onclick = () => {
        scoreEl.textContent = score;
        startLevel(currentLevel + 1);
      };
      levelOverlay.classList.add('active');
    }
  }

  function switchMode(mode) {
    gameMode = mode;
    modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));

    if (mode === 'level') {
      levelBar.classList.add('visible');
      currentLevel = 1;
      score = 0;
      levelStartScore = 0;
      gameTime = 0;
      deathCount = 0;
      obstacles = LEVELS[0].obstacles;
      speed = LEVELS[0].speed;
      levelTransition = false;
      levelOverlay.classList.remove('active');
      victoryOverlay.classList.remove('active');
      leaderboardOverlay.classList.remove('active');
      overlay.classList.remove('active');
      updateLevelUI();
      reset();
    } else {
      levelBar.classList.remove('visible');
      currentLevel = 1;
      score = 0;
      levelStartScore = 0;
      gameTime = 0;
      deathCount = 0;
      obstacles = [];
      speed = 130;
      levelTransition = false;
      levelOverlay.classList.remove('active');
      victoryOverlay.classList.remove('active');
      leaderboardOverlay.classList.remove('active');
      overlay.classList.remove('active');
      reset();
    }
  }

  // 模式切换按钮
  modeBtns.forEach(btn => {
    btn.addEventListener('click', () => switchMode(btn.dataset.mode));
  });

  // ── 颜色主题应用 ─────────────────────────────────
  function applyTheme(theme) {
    currentTheme = theme;
    const [hr, hg, hb] = theme.head;
    const [glowR, glowG, glowB] = theme.glow;

    // 更新标题渐变色
    const titleEl = document.querySelector('.title');
    titleEl.style.background = `linear-gradient(135deg, rgb(${hr},${hg},${hb}), rgb(${glowR},${glowG},${glowB}))`;
    titleEl.style.webkitBackgroundClip = 'text';
    titleEl.style.backgroundClip = 'text';

    // 更新长度指示器颜色
    lengthEl.style.color = `rgb(${hr},${hg},${hb})`;

    // 更新按钮渐变
    const btn = document.getElementById('restartBtn');
    btn.style.background = `linear-gradient(135deg, rgb(${hr},${hg},${hb}), rgb(${glowR},${glowG},${glowB}))`;

    // 更新颜色选择器激活状态
    document.querySelectorAll('.color-dot').forEach(dot => {
      const isActive = dot.dataset.theme === theme.name;
      dot.classList.toggle('active', isActive);
    });

    // 持久化
    try { localStorage.setItem('snake-color-theme', theme.name); } catch(e) {}
  }

  function buildColorPicker() {
    const container = document.getElementById('colorPicker');
    THEMES.forEach(theme => {
      const dot = document.createElement('span');
      dot.className = 'color-dot';
      dot.dataset.theme = theme.name;
      dot.title = theme.label;
      dot.style.backgroundColor = `rgb(${theme.head.join(',')})`;
      dot.style.color = `rgb(${theme.glow.join(',')})`;
      dot.addEventListener('click', () => applyTheme(theme));
      container.appendChild(dot);
    });
    // 初始激活状态
    applyTheme(currentTheme);
  }

  // ── 工具函数：时长格式化 ──────────────────────────
  function formatDuration(ms) {
    const totalSec = Math.floor(ms / 1000);
    const hours = Math.floor(totalSec / 3600);
    const minutes = Math.floor((totalSec % 3600) / 60);
    const seconds = totalSec % 60;
    if (hours > 0) return hours + '时' + minutes + '分' + seconds + '秒';
    if (minutes > 0) return minutes + '分' + seconds + '秒';
    return seconds + '秒';
  }

  // ── 排行榜数据管理 ────────────────────────────────
  function getLeaderboard() {
    try {
      return JSON.parse(localStorage.getItem('snake-leaderboard') || '[]');
    } catch(e) {
      return [];
    }
  }

  function saveToLeaderboard(nickname, duration, deaths) {
    const data = getLeaderboard();
    data.push({
      nickname: nickname,
      duration: duration,
      deaths: deaths,
      date: new Date().toISOString()
    });
    // 按时长升序排列
    data.sort((a, b) => a.duration - b.duration);
    try {
      localStorage.setItem('snake-leaderboard', JSON.stringify(data));
    } catch(e) {}
    return data;
  }

  function renderLeaderboard() {
    const data = getLeaderboard();
    lbTbody.innerHTML = '';

    if (data.length === 0) {
      lbEmpty.style.display = 'block';
      return;
    }
    lbEmpty.style.display = 'none';

    data.forEach((entry, i) => {
      const rank = i + 1;
      const tr = document.createElement('tr');
      let rankClass = '';
      if (rank === 1) rankClass = 'rank-1';
      else if (rank === 2) rankClass = 'rank-2';
      else if (rank === 3) rankClass = 'rank-3';
      if (rankClass) tr.className = rankClass;

      // 格式化日期为简短形式
      let dateStr = '';
      try {
        const d = new Date(entry.date);
        const m = d.getMonth() + 1;
        const day = d.getDate();
        dateStr = m + '/' + day;
      } catch(e) { dateStr = '-'; }

      tr.innerHTML =
        '<td class="lb-col-rank">' + rank + '</td>' +
        '<td class="lb-col-name">' + escapeHtml(entry.nickname) + ' <span style="font-size:10px;color:#555">' + dateStr + '</span></td>' +
        '<td class="lb-col-time">' + formatDuration(entry.duration) + '</td>' +
        '<td class="lb-col-deaths">' + entry.deaths + '</td>';
      lbTbody.appendChild(tr);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function showLeaderboard() {
    renderLeaderboard();
    leaderboardOverlay.classList.add('active');
  }

  function hideLeaderboard() {
    leaderboardOverlay.classList.remove('active');
  }

  // ── 胜利弹窗事件 ──────────────────────────────────
  victorySubmitBtn.addEventListener('click', () => {
    let nickname = victoryNickname.value.trim();
    if (!nickname) nickname = '匿名玩家';
    saveToLeaderboard(nickname, gameTime, deathCount);
    victorySubmitBtn.textContent = '✅ 已提交';
    victorySubmitBtn.disabled = true;
    setTimeout(() => {
      victorySubmitBtn.textContent = '📋 提交记录';
      victorySubmitBtn.disabled = false;
    }, 2000);
  });

  victoryLeaderboardBtn.addEventListener('click', () => {
    showLeaderboard();
  });

  victoryRetryBtn.addEventListener('click', () => {
    victoryOverlay.classList.remove('active');
    leaderboardOverlay.classList.remove('active');
    score = 0;
    levelStartScore = 0;
    gameTime = 0;
    deathCount = 0;
    currentLevel = 1;
    scoreEl.textContent = '0';
    reset();
  });

  // ── 排行榜弹窗事件 ────────────────────────────────
  lbCloseBtn.addEventListener('click', hideLeaderboard);
  leaderboardBtn.addEventListener('click', showLeaderboard);

  // 排行榜弹窗也支持 Enter 关闭（如果未在输入框中）
  // ── 屏幕自适应 ──────────────────────────────────
  function fitToScreen() {
    const isMobile = window.innerWidth < 500;
    // 估算水平方向非画布空间：wrapper padding + 边距
    const padH = isMobile ? 36 : 64;
    // 估算垂直方向非画布空间：header+controls+padding+其他
    const padV = isMobile ? 210 : 250;

    const availW = window.innerWidth - padH;
    const availH = window.innerHeight - padV;

    const maxCell = 24;
    const minCell = 8;

    let newCell = Math.min(maxCell,
      Math.floor(availW / COLS),
      Math.floor(availH / ROWS)
    );
    newCell = Math.max(minCell, newCell);

    if (newCell !== CELL) {
      CELL = newCell;
      applyCanvasSize();
    }
  }

  let resizeTimeout;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      fitToScreen();
    }, 200);
  });

  // ── 启动 ─────────────────────────────────────────
  function init() {
    fitToScreen();
    createBgParticles();
    buildColorPicker();
    bestEl.textContent = highScore;
    reset();
    lastTime = 0;
    requestAnimationFrame(gameLoop);
  }

  init();
})();
</script>
</body>
</html>
