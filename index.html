<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🐍 贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  body {
    width: 100%;
    min-height: 100%;
    min-height: 100dvh;
    background: #0a0a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* 背景粒子 */
  .bg-particle {
    position: fixed;
    border-radius: 50%;
    background: rgba(100, 200, 255, 0.06);
    pointer-events: none;
    animation: float linear infinite;
  }
  @keyframes float {
    0%   { transform: translateY(100vh) scale(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  .game-wrapper {
    position: relative;
    background: linear-gradient(135deg, #111133 0%, #0d0d28 50%, #111133 100%);
    border-radius: 24px;
    padding: 20px;
    box-shadow:
      0 0 60px rgba(80, 120, 255, 0.15),
      0 0 120px rgba(80, 120, 255, 0.05),
      inset 0 1px 0 rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    max-width: 100vw;
    max-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding: 0 4px;
    flex-shrink: 0;
    gap: 8px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .title {
    font-size: 26px;
    font-weight: 700;
    background: linear-gradient(135deg, #4ade80, #22d3ee);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
    white-space: nowrap;
  }

  .scores {
    display: flex;
    gap: 16px;
    flex-shrink: 0;
  }
  .score-item {
    text-align: center;
  }
  .score-label {
    font-size: 10px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 1px;
  }
  .score-value {
    font-size: 20px;
    font-weight: 700;
    color: #e2e8f0;
    font-variant-numeric: tabular-nums;
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  }
  .score-value.best {
    color: #fbbf24;
  }

  .canvas-container {
    position: relative;
    flex-shrink: 0;
    touch-action: none;
  }

  canvas {
    display: block;
    margin: 0 auto;
    border-radius: 12px;
    background: #0a0a1f;
    box-shadow:
      inset 0 0 40px rgba(0,0,0,0.5),
      0 0 0 1px rgba(255,255,255,0.04);
    touch-action: none;
  }

  /* ═══════════════ 键盘提示 & 虚拟 D-Pad ═══════════════ */
  .controls {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .key-hint {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #555;
  }
  .key-badge {
    display: inline-block;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 10px;
    color: #888;
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    min-width: 24px;
    text-align: center;
  }

  .dpad {
    display: none;
    flex-shrink: 0;
    margin-top: 10px;
  }
  .dpad-rows {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .dpad-row {
    display: flex;
    gap: 4px;
  }
  .dpad-btn {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #888;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.1s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }
  .dpad-btn:active,
  .dpad-btn.pressed {
    background: rgba(255,255,255,0.18);
    border-color: rgba(255,255,255,0.25);
    color: #e2e8f0;
    transform: scale(0.92);
    box-shadow: 0 0 16px rgba(100,200,255,0.2);
  }
  .dpad-center {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    color: #555;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .dpad-side-btns {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 24px;
  }
  .dpad-action {
    width: 44px;
    height: 36px;
    border-radius: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    color: #555;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.1s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    letter-spacing: 1px;
  }
  .dpad-action:active {
    background: rgba(255,255,255,0.1);
    color: #999;
    transform: scale(0.93);
  }

  /* ── JS 触屏检测驱动的显示切换 ── */
  .touch-device .controls { display: none; }
  .touch-device .dpad     { display: block; }
  .touch-device .swipe-hint { display: block; }

  /* 游戏结束遮罩 */
  .overlay {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: rgba(0,0,0,0.75);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 14px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 4;
  }
  .overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .overlay-title {
    font-size: 32px;
    font-weight: 700;
    color: #f87171;
    letter-spacing: 2px;
  }
  .overlay-score {
    font-size: 16px;
    color: #94a3b8;
  }
  .overlay-score span {
    color: #fbbf24;
    font-weight: 700;
  }
  .btn {
    background: linear-gradient(135deg, #4ade80, #22d3ee);
    border: none;
    border-radius: 12px;
    padding: 12px 32px;
    font-size: 15px;
    font-weight: 600;
    color: #0a0a1a;
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform 0.15s, box-shadow 0.15s;
    touch-action: manipulation;
  }
  .btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 24px rgba(74, 222, 128, 0.3);
  }
  .btn:active {
    transform: scale(0.96);
  }

  /* 暂停提示 */
  .pause-indicator {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 48px;
    font-weight: 700;
    color: rgba(255,255,255,0.15);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 3;
  }
  .pause-indicator.visible {
    opacity: 1;
  }

  /* 排行榜按钮 */
  .leaderboard-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    width: 34px;
    height: 34px;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    padding: 0;
    line-height: 1;
    flex-shrink: 0;
    touch-action: manipulation;
  }
  .leaderboard-btn:hover {
    background: rgba(255,255,255,0.12);
    transform: scale(1.1);
    box-shadow: 0 0 12px rgba(251, 191, 36, 0.2);
  }

  /* 通关胜利弹窗 */
  .victory-overlay {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 14px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 6;
  }
  .victory-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .victory-title {
    font-size: 28px;
    font-weight: 700;
    color: #fbbf24;
    letter-spacing: 2px;
  }
  .victory-stats {
    display: flex;
    gap: 28px;
  }
  .victory-stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .victory-stat-label {
    font-size: 11px;
    color: #94a3b8;
    letter-spacing: 1px;
  }
  .victory-stat-value {
    font-size: 20px;
    font-weight: 700;
    color: #e2e8f0;
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  }
  .victory-input-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .victory-label {
    font-size: 12px;
    color: #94a3b8;
  }
  .victory-input {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 16px;
    color: #e2e8f0;
    text-align: center;
    width: 220px;
    outline: none;
    font-family: 'Microsoft YaHei', sans-serif;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .victory-input:focus {
    border-color: rgba(251, 191, 36, 0.5);
    box-shadow: 0 0 12px rgba(251, 191, 36, 0.15);
  }
  .victory-input::placeholder {
    color: #555;
  }
  .victory-btns {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn-secondary {
    background: rgba(255,255,255,0.08) !important;
    border: 1px solid rgba(255,255,255,0.12) !important;
    color: #94a3b8 !important;
    padding: 10px 18px !important;
    font-size: 13px !important;
  }
  .btn-secondary:hover {
    background: rgba(255,255,255,0.14) !important;
    box-shadow: 0 0 16px rgba(148, 163, 184, 0.15) !important;
  }

  /* 排行榜弹窗 */
  .leaderboard-overlay {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: rgba(0,0,0,0.88);
    display: flex;
    flex-direction: column;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 7;
    padding: 18px;
  }
  .leaderboard-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .lb-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-shrink: 0;
  }
  .lb-title {
    font-size: 19px;
    font-weight: 700;
    color: #fbbf24;
    letter-spacing: 1px;
  }
  .lb-close {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: #888;
    width: 32px;
    height: 32px;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    touch-action: manipulation;
  }
  .lb-close:hover {
    background: rgba(248, 113, 113, 0.2);
    color: #f87171;
  }
  .lb-table-wrap {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    -webkit-overflow-scrolling: touch;
  }
  .lb-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .lb-table thead th {
    color: #666;
    font-weight: 600;
    padding: 7px 5px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    letter-spacing: 1px;
    font-size: 10px;
    position: sticky;
    top: 0;
    background: rgba(0,0,0,0.88);
  }
  .lb-table tbody td {
    padding: 7px 5px;
    text-align: center;
    color: #cbd5e1;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .lb-table tbody tr {
    transition: background 0.15s;
  }
  .lb-table tbody tr:hover {
    background: rgba(255,255,255,0.03);
  }
  .lb-col-rank { width: 36px; }
  .lb-col-name { width: auto; text-align: left !important; }
  .lb-col-time { width: 72px; font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; }
  .lb-col-deaths { width: 44px; color: #666 !important; font-size: 11px; }
  .lb-table tbody tr.rank-1 td { color: #fbbf24; font-weight: 700; }
  .lb-table tbody tr.rank-2 td { color: #94a3b8; font-weight: 600; }
  .lb-table tbody tr.rank-3 td { color: #d49b5f; font-weight: 600; }
  .lb-empty {
    text-align: center;
    color: #555;
    padding: 32px 0;
    font-size: 13px;
  }
  #victoryDeaths { color: #f87171; }

  /* 移动端滑动指示器 */
  .swipe-hint {
    display: none;
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: rgba(255,255,255,0.2);
    pointer-events: none;
    letter-spacing: 1px;
  }

  /* 颜色选择器 */
  .color-picker {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
    margin-bottom: 10px;
    flex-shrink: 0;
  }
  .color-picker-label {
    font-size: 10px;
    color: #555;
    letter-spacing: 1px;
    margin-right: 3px;
  }
  .color-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    position: relative;
    touch-action: manipulation;
  }
  .color-dot:hover {
    transform: scale(1.2);
    box-shadow: 0 0 12px currentColor;
  }
  .color-dot.active {
    border-color: #fff;
    box-shadow: 0 0 10px currentColor;
    transform: scale(1.15);
  }
  .color-dot.active::after {
    content: '✓';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 4px rgba(0,0,0,0.6);
  }

  /* 模式切换 */
  .mode-toggle {
    display: flex;
    gap: 3px;
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    padding: 2px;
    flex-shrink: 0;
  }
  .mode-btn {
    padding: 4px 12px;
    border-radius: 8px;
    border: none;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    color: #666;
    background: transparent;
    letter-spacing: 1px;
    transition: all 0.2s;
    white-space: nowrap;
    touch-action: manipulation;
  }
  .mode-btn.active {
    background: rgba(255,255,255,0.1);
    color: #e2e8f0;
    box-shadow: 0 0 8px rgba(100,180,255,0.15);
  }
  .mode-btn:hover:not(.active) {
    color: #999;
  }

  /* 关卡信息栏 */
  .level-bar {
    display: none;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    padding: 0 4px;
    flex-shrink: 0;
  }
  .level-bar.visible { display: flex; }
  .level-badge {
    font-size: 12px;
    font-weight: 700;
    color: #fbbf24;
    white-space: nowrap;
    letter-spacing: 1px;
  }
  .level-name {
    font-size: 11px;
    color: #94a3b8;
    white-space: nowrap;
  }
  .progress-wrap {
    flex: 1;
    height: 5px;
    background: rgba(255,255,255,0.05);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, #4ade80, #fbbf24);
    transition: width 0.3s;
    width: 0%;
  }
  .progress-text {
    font-size: 9px;
    color: #555;
    white-space: nowrap;
    min-width: 44px;
    text-align: right;
  }

  /* 用时 & 死亡实时显示 */
  .level-stat {
    font-size: 11px;
    color: #94a3b8;
    white-space: nowrap;
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    border-left: 1px solid rgba(255,255,255,0.06);
    padding-left: 8px;
  }
  .level-stat #liveTime { color: #22d3ee; }
  .level-stat #liveDeaths { color: #f87171; }

  /* 过关遮罩 */
  .level-overlay {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 12px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 5;
  }
  .level-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .level-overlay-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .level-overlay-sub {
    font-size: 14px;
    color: #94a3b8;
  }

  /* ═══════════════ 响应式 — 小屏手机 (< 420px) ═══════════════ */
  @media (max-width: 420px) {
    .game-wrapper {
      padding: 10px;
      border-radius: 16px;
    }
    .header {
      margin-bottom: 6px;
      gap: 5px;
    }
    .header-left { gap: 5px; }
    .title {
      font-size: 18px;
      letter-spacing: 1px;
    }
    .mode-toggle { gap: 2px; border-radius: 8px; padding: 2px; }
    .mode-btn { padding: 3px 9px; font-size: 10px; border-radius: 6px; }
    .leaderboard-btn { width: 28px; height: 28px; font-size: 14px; border-radius: 8px; }
    .scores { gap: 10px; }
    .score-value { font-size: 16px; }
    .score-label { font-size: 8px; }

    .color-picker { gap: 4px; margin-bottom: 6px; }
    .color-dot { width: 18px; height: 18px; }
    .color-picker-label { font-size: 9px; }

    .level-bar { margin-bottom: 6px; gap: 5px; }
    .level-badge { font-size: 10px; }
    .level-name { font-size: 9px; display: none; }
    .level-stat { font-size: 9px; padding-left: 5px; }
    .progress-text { font-size: 8px; min-width: 38px; }

    .btn { padding: 9px 22px; font-size: 13px; }
    .btn-secondary { padding: 8px 14px !important; font-size: 11px !important; }

    .overlay-title { font-size: 22px; }
    .overlay-score { font-size: 13px; }
    .overlay { gap: 10px; }

    .victory-title { font-size: 20px; }
    .victory-stats { gap: 16px; }
    .victory-stat-value { font-size: 16px; }
    .victory-stat-label { font-size: 9px; }
    .victory-input { width: 170px; font-size: 14px; padding: 8px 12px; }
    .victory-btns { gap: 6px; }
    .victory-overlay { gap: 10px; }

    .lb-title { font-size: 15px; }
    .lb-table { font-size: 10px; }
    .leaderboard-overlay { padding: 10px; }

    .pause-indicator { font-size: 36px; }
  }

  /* ═══════════════ 响应式 — 中等手机 (421–600px) ═══════════════ */
  @media (min-width: 421px) and (max-width: 600px) {
    .game-wrapper { padding: 14px; border-radius: 18px; }
    .title { font-size: 22px; }
    .scores { gap: 14px; }
    .score-value { font-size: 18px; }
    .mode-btn { padding: 4px 11px; font-size: 11px; }
    .leaderboard-btn { width: 30px; height: 30px; font-size: 15px; }
    .btn { padding: 10px 26px; font-size: 14px; }
    .overlay-title { font-size: 26px; }
    .victory-title { font-size: 24px; }
  }

  /* ═══════════════ 横屏手机优化 ═══════════════ */
  @media (max-height: 500px) and (orientation: landscape) {
    .game-wrapper {
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 8px;
    }
    .header { width: 100%; margin-bottom: 4px; }
    .color-picker { margin-bottom: 4px; }
    .level-bar { width: 100%; margin-bottom: 4px; }
    .canvas-container { order: 1; }
    .dpad {
      order: 2;
      margin-top: 0;
      margin-left: 8px;
    }
    .dpad-btn { width: 44px; height: 44px; border-radius: 10px; font-size: 20px; }
    .dpad-center { width: 44px; height: 44px; border-radius: 10px; font-size: 14px; }
    .dpad-action { width: 38px; height: 34px; font-size: 11px; }
    .swipe-hint { display: none; }
  }
</style>
</head>
<body>

<!-- 背景粒子 -->
<div id="bg-particles"></div>

<div class="game-wrapper" id="gameWrapper">
  <div class="header">
    <div class="header-left">
      <div class="title">🐍 贪吃蛇</div>
      <div class="mode-toggle" id="modeToggle">
        <button class="mode-btn active" data-mode="classic">经典</button>
        <button class="mode-btn" data-mode="level">闯关</button>
      </div>
    </div>
    <button class="leaderboard-btn" id="leaderboardBtn" title="排行榜">🏆</button>
    <div class="scores">
      <div class="score-item">
        <div class="score-label">得分</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-item">
        <div class="score-label">最高分</div>
        <div class="score-value best" id="bestScore">0</div>
      </div>
      <div class="score-item">
        <div class="score-label">长度</div>
        <div class="score-value" id="length" style="color:#4ade80">3</div>
      </div>
    </div>
  </div>

  <div class="color-picker" id="colorPicker">
    <span class="color-picker-label">蛇皮</span>
  </div>

  <div class="level-bar" id="levelBar">
    <span class="level-badge" id="levelBadge">第 1 / 5 关</span>
    <span class="level-name" id="levelName">初入蛇穴</span>
    <div class="progress-wrap">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span class="progress-text" id="progressText">0 / 50</span>
    <span class="level-stat">⏱ <span id="liveTime">0秒</span></span>
    <span class="level-stat">💀 <span id="liveDeaths">0</span></span>
  </div>

  <div class="canvas-container" id="canvasContainer">
    <canvas id="canvas"></canvas>
    <div class="overlay" id="overlay">
      <div class="overlay-title" id="overlayTitle">游戏结束</div>
      <div class="overlay-score">得分: <span id="overlayScore">0</span></div>
      <button class="btn" id="restartBtn">🔄 再来一局</button>
    </div>
    <div class="level-overlay" id="levelOverlay">
      <div class="level-overlay-title" id="lvlOverlayTitle" style="color:#4ade80;">🎉 通关！</div>
      <div class="level-overlay-sub" id="lvlOverlaySub"></div>
      <button class="btn" id="lvlNextBtn">▶ 下一关</button>
    </div>
    <div class="pause-indicator" id="pauseIndicator">⏸ 暂停</div>
    <div class="victory-overlay" id="victoryOverlay">
      <div class="victory-title">🏆 全部通关！</div>
      <div class="victory-stats">
        <div class="victory-stat">
          <span class="victory-stat-label">⏱ 总用时</span>
          <span class="victory-stat-value" id="victoryTime">0秒</span>
        </div>
        <div class="victory-stat">
          <span class="victory-stat-label">💀 死亡次数</span>
          <span class="victory-stat-value" id="victoryDeaths">0</span>
        </div>
      </div>
      <div class="victory-input-wrap">
        <label class="victory-label">留下你的昵称 ✍️</label>
        <input type="text" class="victory-input" id="victoryNickname" maxlength="12" placeholder="输入昵称（最多12字）" autocomplete="off" enterkeyhint="done">
      </div>
      <div class="victory-btns">
        <button class="btn" id="victorySubmitBtn">📋 提交记录</button>
        <button class="btn btn-secondary" id="victoryLeaderboardBtn">🏆 查看排行榜</button>
        <button class="btn btn-secondary" id="victoryRetryBtn">🔄 重新挑战</button>
      </div>
    </div>
    <div class="leaderboard-overlay" id="leaderboardOverlay">
      <div class="lb-header">
        <span class="lb-title">🏆 通关排行榜</span>
        <button class="lb-close" id="lbCloseBtn">✕</button>
      </div>
      <div class="lb-table-wrap">
        <table class="lb-table" id="lbTable">
          <thead>
            <tr>
              <th class="lb-col-rank">#</th>
              <th class="lb-col-name">昵称</th>
              <th class="lb-col-time">用时</th>
              <th class="lb-col-deaths">死亡</th>
            </tr>
          </thead>
          <tbody id="lbTbody"></tbody>
        </table>
        <div class="lb-empty" id="lbEmpty">暂无通关记录，快来挑战吧！</div>
      </div>
    </div>
    <div class="swipe-hint" id="swipeHint">↑ 滑动控制方向</div>
  </div>

  <!-- 桌面端键盘提示 -->
  <div class="controls" id="keyControls">
    <span class="key-hint"><span class="key-badge">↑↓←→</span> 或</span>
    <span class="key-hint"><span class="key-badge">W A S D</span> 移动</span>
    <span class="key-hint"><span class="key-badge">Space</span> 暂停</span>
    <span class="key-hint"><span class="key-badge">R</span> 重新开始</span>
  </div>

  <!-- 移动端虚拟方向键 -->
  <div class="dpad" id="dpad">
    <div class="dpad-rows">
      <div class="dpad-row">
        <div class="dpad-btn" data-dir="up" id="dpadUp">▲</div>
      </div>
      <div class="dpad-row">
        <div class="dpad-btn" data-dir="left" id="dpadLeft">◀</div>
        <div class="dpad-center" id="dpadPause">⏯</div>
        <div class="dpad-btn" data-dir="right" id="dpadRight">▶</div>
      </div>
      <div class="dpad-row">
        <div class="dpad-btn" data-dir="down" id="dpadDown">▼</div>
      </div>
    </div>
    <div class="dpad-side-btns">
      <button class="dpad-action" id="dpadRestart">🔄</button>
    </div>
  </div>
</div>

<script>
(function() {
  // ── 触屏检测 & class 注入 ──────────────────────
  const isTouchDevice = ('ontouchstart' in window) ||
    (navigator.maxTouchPoints > 0) ||
    (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);

  if (isTouchDevice) {
    document.body.classList.add('touch-device');
  }

  // ── DOM ──────────────────────────────────────────
  const canvas   = document.getElementById('canvas');
  const ctx      = canvas.getContext('2d');
  const scoreEl  = document.getElementById('score');
  const bestEl   = document.getElementById('bestScore');
  const lengthEl = document.getElementById('length');
  const overlay  = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayScore = document.getElementById('overlayScore');
  const pauseInd   = document.getElementById('pauseIndicator');
  const restartBtn = document.getElementById('restartBtn');
  const swipeHint = document.getElementById('swipeHint');

  // 关卡模式 DOM
  const levelBar     = document.getElementById('levelBar');
  const levelBadge   = document.getElementById('levelBadge');
  const levelNameEl  = document.getElementById('levelName');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const levelOverlay = document.getElementById('levelOverlay');
  const lvlOverlayTitle = document.getElementById('lvlOverlayTitle');
  const lvlOverlaySub   = document.getElementById('lvlOverlaySub');
  const lvlNextBtn      = document.getElementById('lvlNextBtn');
  const modeBtns     = document.querySelectorAll('.mode-btn');

  // 通关 & 排行榜 DOM
  const victoryOverlay     = document.getElementById('victoryOverlay');
  const victoryTime        = document.getElementById('victoryTime');
  const victoryDeaths      = document.getElementById('victoryDeaths');
  const victoryNickname    = document.getElementById('victoryNickname');
  const victorySubmitBtn   = document.getElementById('victorySubmitBtn');
  const victoryLeaderboardBtn = document.getElementById('victoryLeaderboardBtn');
  const victoryRetryBtn    = document.getElementById('victoryRetryBtn');
  const leaderboardOverlay = document.getElementById('leaderboardOverlay');
  const lbTbody            = document.getElementById('lbTbody');
  const lbEmpty            = document.getElementById('lbEmpty');
  const lbCloseBtn         = document.getElementById('lbCloseBtn');
  const leaderboardBtn     = document.getElementById('leaderboardBtn');
  const liveTimeEl         = document.getElementById('liveTime');
  const liveDeathsEl       = document.getElementById('liveDeaths');

  // D-pad DOM
  const dpadBtns = document.querySelectorAll('.dpad-btn[data-dir]');
  const dpadPause = document.getElementById('dpadPause');
  const dpadRestart = document.getElementById('dpadRestart');

  // ── 常量 ─────────────────────────────────────────
  let   CELL   = 24;
  const COLS   = 24;
  const ROWS   = 24;
  let   WIDTH  = COLS * CELL;
  let   HEIGHT = ROWS * CELL;

  function applyCanvasSize() {
    WIDTH  = COLS * CELL;
    HEIGHT = ROWS * CELL;
    canvas.width  = WIDTH;
    canvas.height = HEIGHT;
  }

  applyCanvasSize();

  // ── 游戏状态 ─────────────────────────────────────
  let snake    = [];
  let food     = null;
  let special  = null;
  let specialTimer = 0;
  let dir      = { x: 1, y: 0 };
  let nextDir  = { x: 1, y: 0 };
  let score    = 0;
  let highScore = 0;
  let gameOver = false;
  let paused   = false;
  let speed    = 140;
  let tickAcc  = 0;
  let lastTime = 0;
  let particles = [];
  let growing  = false;
  let growCount = 0;
  let frameCount = 0;
  let gameTime   = 0;
  let deathCount = 0;

  try {
    const saved = localStorage.getItem('snake-high-score');
    if (saved) highScore = parseInt(saved, 10) || 0;
  } catch(e) {}

  // ── 颜色主题 ─────────────────────────────────────
  const THEMES = [
    { name: 'green',  label: '翠绿', head: [34, 197, 94],  tail: [20, 120, 50],   glow: [74, 222, 128] },
    { name: 'blue',   label: '海蓝', head: [59, 130, 246], tail: [30, 64, 140],    glow: [96, 165, 250]  },
    { name: 'purple', label: '星紫', head: [168, 85, 247], tail: [90, 40, 140],    glow: [192, 132, 252] },
    { name: 'pink',   label: '桃粉', head: [244, 114, 182],tail: [150, 50, 100],   glow: [244, 114, 182] },
    { name: 'orange', label: '赤橙', head: [251, 146, 60], tail: [160, 70, 20],    glow: [251, 146, 60]  },
    { name: 'gold',   label: '耀金', head: [250, 204, 21], tail: [150, 110, 10],   glow: [250, 204, 21]  },
    { name: 'cyan',   label: '冰青', head: [34, 211, 238], tail: [15, 110, 130],   glow: [34, 211, 238]  },
    { name: 'red',    label: '赤红', head: [248, 113, 113],tail: [150, 40, 40],    glow: [248, 113, 113] },
  ];
  let currentTheme = THEMES[0];

  try {
    const savedTheme = localStorage.getItem('snake-color-theme');
    if (savedTheme) {
      const found = THEMES.find(t => t.name === savedTheme);
      if (found) currentTheme = found;
    }
  } catch(e) {}

  // ── 闯关模式状态 ─────────────────────────────────
  let gameMode     = 'classic';
  let currentLevel = 1;
  let levelStartScore = 0;
  let obstacles    = [];
  let levelTransition = false;
  let countdownRemaining = 0;

  // ── 障碍物生成工具 ───────────────────────────────
  function hLine(x, y, len) {
    const pts = [];
    for (let i = 0; i < len; i++) pts.push({x: x + i, y});
    return pts;
  }
  function vLine(x, y, len) {
    const pts = [];
    for (let i = 0; i < len; i++) pts.push({x, y: y + i});
    return pts;
  }
  function rectObs(x, y, w, h) {
    const pts = [];
    for (let dx = 0; dx < w; dx++)
      for (let dy = 0; dy < h; dy++)
        pts.push({x: x + dx, y: y + dy});
    return pts;
  }
  function dedupe(pts) {
    const seen = new Set();
    return pts.filter(p => {
      const k = `${p.x},${p.y}`;
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });
  }

  // ── 关卡定义 ─────────────────────────────────────
  const LEVELS = [
    {
      name: '初入蛇穴', target: 50, speed: 140,
      obstacles: dedupe([].concat(
        vLine(18, 4, 16),
        hLine(3, 8, 6), hLine(15, 8, 5),
      ))
    },
    {
      name: '曲折前进', target: 120, speed: 125,
      obstacles: dedupe([].concat(
        vLine(3, 3, 7), hLine(3, 3, 7),
        vLine(20, 3, 7), hLine(14, 3, 7),
        vLine(3, 14, 7), hLine(3, 17, 7),
        vLine(20, 14, 7), hLine(14, 17, 7),
        rectObs(7, 11, 1, 2), rectObs(16, 11, 1, 2),
      ))
    },
    {
      name: '迷宫探险', target: 210, speed: 110,
      obstacles: dedupe([].concat(
        hLine(3, 3, 9), hLine(12, 3, 9),
        hLine(3, 20, 9), hLine(12, 20, 9),
        vLine(3, 5, 6), vLine(3, 13, 6),
        vLine(20, 5, 6), vLine(20, 13, 6),
        hLine(8, 10, 8), hLine(8, 13, 8),
        vLine(10, 10, 4),
      ))
    },
    {
      name: '步步惊心', target: 320, speed: 100,
      obstacles: dedupe([].concat(
        hLine(2, 2, 8), hLine(14, 2, 8),
        hLine(2, 21, 8), hLine(14, 21, 8),
        vLine(2, 4, 6), vLine(2, 14, 6),
        vLine(21, 4, 6), vLine(21, 14, 6),
        hLine(5, 8, 5), hLine(14, 8, 5),
        hLine(5, 15, 5), hLine(14, 15, 5),
        vLine(8, 5, 5), vLine(8, 14, 5),
        vLine(15, 5, 5), vLine(15, 14, 5),
      ))
    },
    {
      name: '终极挑战', target: 450, speed: 80,
      obstacles: dedupe([].concat(
        hLine(1, 1, 7), hLine(9, 1, 6), hLine(16, 1, 7),
        hLine(1, 22, 7), hLine(9, 22, 6), hLine(16, 22, 7),
        vLine(1, 3, 6), vLine(1, 10, 4), vLine(1, 15, 6),
        vLine(22, 3, 6), vLine(22, 10, 4), vLine(22, 15, 6),
        hLine(4, 5, 4), hLine(16, 5, 4),
        hLine(4, 18, 4), hLine(16, 18, 4),
        vLine(5, 7, 4), vLine(5, 13, 4),
        vLine(18, 7, 4), vLine(18, 13, 4),
        hLine(7, 11, 3), hLine(14, 11, 3),
        rectObs(8, 10, 2, 4), rectObs(14, 10, 2, 4),
        rectObs(2, 2, 4, 2), rectObs(18, 2, 4, 2),
        rectObs(2, 20, 4, 2), rectObs(18, 20, 4, 2),
      ))
    },
  ];

  // ── 工具函数 ─────────────────────────────────────
  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function gridPos() {
    return { x: randInt(0, COLS - 1), y: randInt(0, ROWS - 1) };
  }

  function occupies(pos) {
    if (snake.some(s => s.x === pos.x && s.y === pos.y)) return true;
    if (obstacles.some(o => o.x === pos.x && o.y === pos.y)) return true;
    return false;
  }

  function spawnFood() {
    let pos;
    do { pos = gridPos(); } while (occupies(pos));
    return { ...pos, pulse: 0 };
  }

  function spawnSpecial() {
    let pos;
    do { pos = gridPos(); } while (occupies(pos) || (food && pos.x === food.x && pos.y === food.y));
    return { ...pos, life: 130 };
  }

  // ── 粒子系统 ─────────────────────────────────────
  function emitParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
      const spd = 1.5 + Math.random() * 3;
      particles.push({
        x: x * CELL + CELL / 2,
        y: y * CELL + CELL / 2,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        life: 1,
        decay: 0.02 + Math.random() * 0.04,
        color: color,
        size: 2 + Math.random() * 3
      });
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawParticles(ctx) {
    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // ── 重置 ─────────────────────────────────────────
  function reset() {
    const midX = Math.floor(COLS / 2);
    const midY = Math.floor(ROWS / 2);
    snake = [
      { x: midX, y: midY },
      { x: midX - 1, y: midY },
      { x: midX - 2, y: midY }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    gameOver = false;
    paused = false;
    growing = false;
    growCount = 0;
    particles = [];
    special = null;
    specialTimer = 0;
    tickAcc = 0;

    if (gameMode === 'level') {
      const lvl = LEVELS[currentLevel - 1];
      speed = lvl.speed;
      obstacles = lvl.obstacles;
      score = levelStartScore;
      levelTransition = false;

      scoreEl.textContent = score;
      lengthEl.textContent = snake.length;
      overlay.classList.remove('active');
      levelOverlay.classList.remove('active');
      pauseInd.classList.remove('visible');
      updateLevelUI();
      countdownRemaining = 3000;
      food = spawnFood();
    } else {
      score = 0;
      speed = 140;
      obstacles = [];
      levelTransition = false;
      countdownRemaining = 0;

      scoreEl.textContent = '0';
      lengthEl.textContent = snake.length;
      overlay.classList.remove('active');
      levelOverlay.classList.remove('active');
      pauseInd.classList.remove('visible');
      food = spawnFood();
    }
  }

  function die() {
    gameOver = true;
    if (score > highScore) {
      highScore = score;
      try { localStorage.setItem('snake-high-score', highScore); } catch(e) {}
      bestEl.textContent = highScore;
      overlayTitle.textContent = '🏆 新纪录!';
    } else {
      overlayTitle.textContent = '游戏结束';
    }
    overlayScore.textContent = score;
    overlay.classList.add('active');

    if (gameMode === 'level') {
      deathCount++;
      restartBtn.textContent = '🔄 重试本关';
    } else {
      restartBtn.textContent = '🔄 再来一局';
    }
  }

  // ── 方向变更（统一入口）─────────────────────────
  function changeDir(dx, dy) {
    if (dx === 0 && dy === -1 && dir.y !== 1) { nextDir = { x: 0, y: -1 }; return true; }
    if (dx === 0 && dy === 1  && dir.y !== -1) { nextDir = { x: 0, y: 1 };  return true; }
    if (dx === -1 && dy === 0 && dir.x !== 1)  { nextDir = { x: -1, y: 0 }; return true; }
    if (dx === 1  && dy === 0 && dir.x !== -1) { nextDir = { x: 1, y: 0 };  return true; }
    return false;
  }

  // ── 键盘输入 ─────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (leaderboardOverlay.classList.contains('active')) {
      if (e.key === 'Escape') { hideLeaderboard(); }
      return;
    }

    if (victoryOverlay.classList.contains('active')) {
      if (e.key === 'Enter') { victorySubmitBtn.click(); }
      return;
    }

    if (levelTransition && levelOverlay.classList.contains('active')) {
      if (e.key === 'Enter') { lvlNextBtn.click(); }
      return;
    }

    if (gameOver) {
      if (e.key === 'r' || e.key === 'R' || e.key === 'Enter') {
        if (gameMode === 'level') {
          score = levelStartScore;
          scoreEl.textContent = score;
        }
        reset();
      }
      return;
    }

    switch (e.key) {
      case 'ArrowUp':    case 'w': case 'W': changeDir(0, -1); e.preventDefault(); break;
      case 'ArrowDown':  case 's': case 'S': changeDir(0, 1);  e.preventDefault(); break;
      case 'ArrowLeft':  case 'a': case 'A': changeDir(-1, 0); e.preventDefault(); break;
      case 'ArrowRight': case 'd': case 'D': changeDir(1, 0);  e.preventDefault(); break;
      case ' ':
        paused = !paused;
        pauseInd.classList.toggle('visible', paused);
        e.preventDefault();
        break;
      case 'r': case 'R':
        if (gameMode === 'level') {
          score = levelStartScore;
          scoreEl.textContent = score;
        }
        reset();
        e.preventDefault();
        break;
    }
  });

  restartBtn.addEventListener('click', () => {
    if (gameMode === 'level') {
      score = levelStartScore;
      scoreEl.textContent = score;
    }
    reset();
  });

  // ── Canvas 触摸滑动 ──────────────────────────────
  let touchStartX = 0;
  let touchStartY = 0;
  let touchStartTime = 0;
  let touchMoved = false;

  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    e.stopPropagation();
    if (e.touches.length === 1) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchStartTime = Date.now();
      touchMoved = false;
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    e.stopPropagation();
    if (e.touches.length !== 1) return;
    if (gameOver || paused || countdownRemaining > 0 || levelTransition) return;

    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);

    if (absDx > 16 || absDy > 16) {
      touchMoved = true;
      if (absDx > absDy) {
        changeDir(dx > 0 ? 1 : -1, 0);
      } else {
        changeDir(0, dy > 0 ? 1 : -1);
      }
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }
  }, { passive: false });

  canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    e.stopPropagation();
    const elapsed = Date.now() - touchStartTime;
    if (!touchMoved && elapsed < 200) {
      if (!gameOver && !levelTransition) {
        paused = !paused;
        pauseInd.classList.toggle('visible', paused);
      }
    }
    touchMoved = false;
  });

  // ── 虚拟方向键 (D-pad) ───────────────────────────
  function addDpadListeners() {
    dpadBtns.forEach(btn => {
      const dir = btn.dataset.dir;
      const dirMap = {
        up:    { x: 0, y: -1 },
        down:  { x: 0, y: 1 },
        left:  { x: -1, y: 0 },
        right: { x: 1, y: 0 },
      };
      const d = dirMap[dir];

      btn.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        btn.classList.add('pressed');
        if (!gameOver && !paused && countdownRemaining <= 0 && !levelTransition) {
          changeDir(d.x, d.y);
        }
      });

      btn.addEventListener('pointerup', function(e) {
        e.preventDefault();
        btn.classList.remove('pressed');
      });

      btn.addEventListener('pointerleave', function(e) {
        btn.classList.remove('pressed');
      });

      btn.addEventListener('pointercancel', function(e) {
        btn.classList.remove('pressed');
      });
    });

    dpadPause.addEventListener('pointerdown', function(e) {
      e.preventDefault();
      e.stopPropagation();
      if (!gameOver && !levelTransition) {
        paused = !paused;
        pauseInd.classList.toggle('visible', paused);
      }
    });

    dpadRestart.addEventListener('pointerdown', function(e) {
      e.preventDefault();
      e.stopPropagation();
      if (gameMode === 'level') {
        score = levelStartScore;
        scoreEl.textContent = score;
      }
      reset();
    });
  }

  addDpadListeners();

  // ── 更新逻辑 ─────────────────────────────────────
  function update(dt) {
    if (gameOver || paused) return;

    if (countdownRemaining > 0) {
      countdownRemaining -= dt;
      if (countdownRemaining < 0) countdownRemaining = 0;
      tickAcc = 0;
      updateParticles();
      if (food) food.pulse = (food.pulse + 0.08) % (Math.PI * 2);
      return;
    }

    if (gameMode === 'level') {
      gameTime += dt;
    }

    tickAcc += dt;
    while (tickAcc >= speed) {
      tickAcc -= speed;
      step();
    }

    updateParticles();

    if (food) food.pulse = (food.pulse + 0.08) % (Math.PI * 2);

    if (special) {
      special.life--;
      if (special.life <= 0) {
        special = null;
        specialTimer = 200;
      }
    }
    if (!special && specialTimer > 0) {
      specialTimer--;
      if (specialTimer === 0 && Math.random() < 0.3) {
        special = spawnSpecial();
      }
    }
    if (!special && specialTimer === 0) {
      specialTimer = 1;
    }

    frameCount++;
  }

  function step() {
    dir = { ...nextDir };

    const head = {
      x: snake[0].x + dir.x,
      y: snake[0].y + dir.y
    };

    if (head.x < 0) head.x = COLS - 1;
    if (head.x >= COLS) head.x = 0;
    if (head.y < 0) head.y = ROWS - 1;
    if (head.y >= ROWS) head.y = 0;

    if (obstacles.some(o => o.x === head.x && o.y === head.y)) {
      emitParticles(head.x, head.y, '#ef4444', 20);
      die();
      return;
    }

    if (snake.some((s, i) => i < snake.length - 1 && s.x === head.x && s.y === head.y)) {
      emitParticles(head.x, head.y, '#f87171', 20);
      die();
      return;
    }

    snake.unshift(head);

    if (food && head.x === food.x && head.y === food.y) {
      score += 10;
      growing = true;
      growCount += 1;
      emitParticles(food.x, food.y, `rgb(${currentTheme.glow.join(',')})`, 12);
      food = spawnFood();

      if (gameMode === 'classic' && speed > 65) {
        speed = Math.max(65, speed - 1.5);
      }

      scoreEl.textContent = score;
      lengthEl.textContent = snake.length;

      if (gameMode === 'level') {
        updateLevelUI();
        const lvl = LEVELS[currentLevel - 1];
        if (score - levelStartScore >= lvl.target) {
          completeLevel();
          return;
        }
      }
    }

    if (special && head.x === special.x && head.y === special.y) {
      score += 30;
      growing = true;
      growCount += 2;
      emitParticles(special.x, special.y, '#fbbf24', 18);
      special = null;
      specialTimer = 150;

      scoreEl.textContent = score;
      lengthEl.textContent = snake.length;

      if (gameMode === 'level') {
        updateLevelUI();
        const lvl = LEVELS[currentLevel - 1];
        if (score - levelStartScore >= lvl.target) {
          completeLevel();
          return;
        }
      }
    }

    if (growing) {
      if (growCount > 0) { growCount--; }
      if (growCount === 0) { growing = false; }
    } else {
      snake.pop();
    }

    lengthEl.textContent = snake.length;
  }

  // ── 渲染 ─────────────────────────────────────────
  function drawGrid() {
    ctx.strokeStyle = 'rgba(255,255,255,0.015)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath();
      ctx.moveTo(x * CELL, 0);
      ctx.lineTo(x * CELL, HEIGHT);
      ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * CELL);
      ctx.lineTo(WIDTH, y * CELL);
      ctx.stroke();
    }
  }

  function drawFood() {
    if (!food) return;
    const fx = food.x * CELL + CELL / 2;
    const fy = food.y * CELL + CELL / 2;
    const pulse = 1 + Math.sin(food.pulse) * 0.15;

    const glow = ctx.createRadialGradient(fx, fy, CELL * 0.15, fx, fy, CELL * 0.65 * pulse);
    glow.addColorStop(0, 'rgba(248, 113, 113, 0.35)');
    glow.addColorStop(1, 'rgba(248, 113, 113, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(fx - CELL*0.7, fy - CELL*0.7, CELL*1.4, CELL*1.4);

    const r = CELL * 0.35 * pulse;
    ctx.fillStyle = '#f87171';
    ctx.shadowColor = '#f87171';
    ctx.shadowBlur = Math.max(6, CELL * 0.4);
    ctx.beginPath();
    ctx.arc(fx, fy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.arc(fx - r*0.3, fy - r*0.3, r*0.35, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSpecialFood() {
    if (!special) return;
    const sx = special.x * CELL + CELL / 2;
    const sy = special.y * CELL + CELL / 2;
    const alpha = special.life < 20 ? special.life / 20 : 1;

    ctx.save();
    ctx.globalAlpha = alpha;

    const glow = ctx.createRadialGradient(sx, sy, CELL * 0.1, sx, sy, CELL * 0.7);
    glow.addColorStop(0, 'rgba(251, 191, 36, 0.4)');
    glow.addColorStop(1, 'rgba(251, 191, 36, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(sx - CELL*0.7, sy - CELL*0.7, CELL*1.4, CELL*1.4);

    const spikes = 5;
    const outerR = CELL * 0.4;
    const innerR = CELL * 0.18;
    ctx.fillStyle = '#fbbf24';
    ctx.shadowColor = '#fbbf24';
    ctx.shadowBlur = Math.max(8, CELL * 0.5);
    ctx.beginPath();
    for (let i = 0; i < spikes * 2; i++) {
      const r = i % 2 === 0 ? outerR : innerR;
      const angle = (Math.PI * 2 * i) / (spikes * 2) - Math.PI / 2;
      const px = sx + Math.cos(angle) * r;
      const py = sy + Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.restore();
  }

  function drawSnake() {
    if (snake.length === 0) return;

    const [hr, hg, hb] = currentTheme.head;
    const [tr, tg, tb] = currentTheme.tail;

    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const t = i / Math.max(snake.length - 1, 1);
      const cx = s.x * CELL;
      const cy = s.y * CELL;

      const r = Math.floor(hr + t * (tr - hr));
      const g = Math.floor(hg + t * (tg - hg));
      const b = Math.floor(hb + t * (tb - hb));
      const alpha = 1 - t * 0.5;

      ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;

      const pad = i === 0 ? 1 : (CELL > 16 ? 2 : 1);
      const radius = i === 0 ? Math.min(7, CELL * 0.3) : Math.min(5, CELL * 0.22);
      roundRect(cx + pad, cy + pad, CELL - pad * 2, CELL - pad * 2, radius);
      ctx.fill();
    }

    const head = snake[0];
    const hx = head.x * CELL + CELL / 2;
    const hy = head.y * CELL + CELL / 2;
    const [glowR, glowG, glowB] = currentTheme.glow;
    const hGlow = ctx.createRadialGradient(hx, hy, CELL * 0.2, hx, hy, CELL * 0.8);
    hGlow.addColorStop(0, `rgba(${glowR},${glowG},${glowB},0.3)`);
    hGlow.addColorStop(1, `rgba(${glowR},${glowG},${glowB},0)`);
    ctx.fillStyle = hGlow;
    ctx.fillRect(hx - CELL, hy - CELL, CELL * 2, CELL * 2);

    drawEyes(head);
  }

  function drawEyes(head) {
    const cx = head.x * CELL + CELL / 2;
    const cy = head.y * CELL + CELL / 2;
    const scale = CELL / 24;
    const eyeR = 3 * scale;
    const pupilR = 1.8 * scale;
    const offset = 5 * scale;

    let e1x, e1y, e2x, e2y;
    if (dir.x === 1) {
      e1x = cx + offset; e1y = cy - 4 * scale;
      e2x = cx + offset; e2y = cy + 4 * scale;
    } else if (dir.x === -1) {
      e1x = cx - offset; e1y = cy - 4 * scale;
      e2x = cx - offset; e2y = cy + 4 * scale;
    } else if (dir.y === -1) {
      e1x = cx - 4 * scale; e1y = cy - offset;
      e2x = cx + 4 * scale; e2y = cy - offset;
    } else {
      e1x = cx - 4 * scale; e1y = cy + offset;
      e2x = cx + 4 * scale; e2y = cy + offset;
    }

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(e1x, e1y, eyeR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(e2x, e2y, eyeR, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(e1x + dir.x * 1.2 * scale, e1y + dir.y * 1.2 * scale, pupilR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(e2x + dir.x * 1.2 * scale, e2y + dir.y * 1.2 * scale, pupilR, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawObstacles() {
    for (const o of obstacles) {
      const ox = o.x * CELL;
      const oy = o.y * CELL;
      const m = Math.max(1, CELL * 0.04);

      const grad = ctx.createLinearGradient(ox, oy, ox, oy + CELL);
      grad.addColorStop(0, '#3d3d5c');
      grad.addColorStop(0.5, '#2a2a40');
      grad.addColorStop(1, '#1a1a30');
      ctx.fillStyle = grad;
      roundRect(ox + m, oy + m, CELL - m * 2, CELL - m * 2, Math.min(3, CELL * 0.12));
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(ox + m + 3, oy + m);
      ctx.lineTo(ox + CELL - m - 3, oy + m);
      ctx.stroke();

      if (CELL >= 16) {
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(ox + 5, oy + 7);
        ctx.lineTo(ox + 10, oy + 14);
        ctx.stroke();
      }
    }
  }

  function drawParticlesOnCanvas() {
    drawParticles(ctx);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function render() {
    updateLiveStats();
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    drawGrid();
    drawObstacles();
    drawSpecialFood();
    drawFood();
    drawSnake();
    drawParticlesOnCanvas();

    if (countdownRemaining > 0 && gameMode === 'level') {
      const sec = Math.ceil(countdownRemaining / 1000);
      const alpha = (countdownRemaining % 1000) / 1000;
      const scale = 1 + (1 - alpha) * 0.3;

      ctx.save();
      ctx.globalAlpha = 0.6 * (alpha * 0.5 + 0.5);
      ctx.fillStyle = '#0a0a1f';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.globalAlpha = Math.min(1, alpha + 0.3);
      ctx.fillStyle = '#fbbf24';
      const fontSize = Math.floor(72 * scale * (CELL / 24));
      ctx.font = `bold ${fontSize}px "Microsoft YaHei", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = '#fbbf24';
      ctx.shadowBlur = 20;
      ctx.fillText(sec, WIDTH / 2, HEIGHT / 2);
      ctx.restore();
    }

    if (gameOver) {
      ctx.fillStyle = 'rgba(248, 113, 113, 0.06)';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
    }
  }

  // ── 游戏循环 ─────────────────────────────────────
  function gameLoop(timestamp) {
    if (lastTime === 0) lastTime = timestamp;
    let dt = timestamp - lastTime;
    lastTime = timestamp;

    if (dt > 500) dt = 500;

    update(dt);
    render();

    requestAnimationFrame(gameLoop);
  }

  // ── 背景粒子 ────────────────────────────────────
  function createBgParticles() {
    const container = document.getElementById('bg-particles');
    const count = isTouchDevice ? 10 : 30;
    for (let i = 0; i < count; i++) {
      const particle = document.createElement('div');
      particle.className = 'bg-particle';
      const size = 2 + Math.random() * 4;
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDuration = (8 + Math.random() * 20) + 's';
      particle.style.animationDelay = Math.random() * 15 + 's';
      container.appendChild(particle);
    }
  }

  // ── 关卡模式逻辑 ─────────────────────────────────
  function updateLevelUI() {
    const lvl = LEVELS[currentLevel - 1];
    const earned = score - levelStartScore;
    const pct = Math.min(100, Math.round((earned / lvl.target) * 100));
    levelBadge.textContent = `第 ${currentLevel} / ${LEVELS.length} 关`;
    levelNameEl.textContent = lvl.name;
    progressFill.style.width = pct + '%';
    progressText.textContent = earned + ' / ' + lvl.target;
  }

  function updateLiveStats() {
    if (gameMode === 'level') {
      liveTimeEl.textContent = formatDuration(gameTime);
      liveDeathsEl.textContent = deathCount;
    }
  }

  function startLevel(n) {
    currentLevel = n;
    const lvl = LEVELS[n - 1];
    obstacles = lvl.obstacles;
    speed = lvl.speed;
    levelStartScore = score;
    levelTransition = false;
    levelOverlay.classList.remove('active');
    updateLevelUI();
    resetSnakeOnly();
    countdownRemaining = 3000;
  }

  function resetSnakeOnly() {
    const midX = Math.floor(COLS / 2);
    const midY = Math.floor(ROWS / 2);
    snake = [
      { x: midX, y: midY },
      { x: midX - 1, y: midY },
      { x: midX - 2, y: midY }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    growing = false;
    growCount = 0;
    particles = [];
    special = null;
    specialTimer = 0;
    tickAcc = 0;
    food = spawnFood();
    lengthEl.textContent = snake.length;
    scoreEl.textContent = score;
    paused = false;
    gameOver = false;
    pauseInd.classList.remove('visible');
  }

  function completeLevel() {
    levelTransition = true;
    paused = true;
    countdownRemaining = 0;
    if (currentLevel >= LEVELS.length) {
      // 五关全过 → 重置到第一关
      try { localStorage.setItem('snake-level-progress', '1'); } catch(e) {}
      if (score > highScore) {
        highScore = score;
        try { localStorage.setItem('snake-high-score', highScore); } catch(e) {}
        bestEl.textContent = highScore;
      }
      victoryTime.textContent = formatDuration(gameTime);
      victoryDeaths.textContent = deathCount;
      victoryNickname.value = '';
      victoryOverlay.classList.add('active');
      setTimeout(() => { victoryNickname.focus(); }, 400);
    } else {
      lvlOverlayTitle.textContent = '🎉 第 ' + currentLevel + ' 关通过！';
      lvlOverlayTitle.style.color = '#4ade80';
      lvlOverlaySub.textContent = '得分: ' + score + '  |  准备进入第 ' + (currentLevel + 1) + ' 关';
      lvlNextBtn.textContent = '▶ 进入下一关';
      lvlNextBtn.onclick = () => {
        scoreEl.textContent = score;
        const nextLevel = currentLevel + 1;
        try { localStorage.setItem('snake-level-progress', String(nextLevel)); } catch(e) {}
        startLevel(nextLevel);
      };
      levelOverlay.classList.add('active');
    }
  }

  function switchMode(mode) {
    gameMode = mode;
    modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));

    if (mode === 'level') {
      levelBar.classList.add('visible');
      // 读取保存的闯关进度（五关全过则从第1关开始）
      let savedLevel = 1;
      try { savedLevel = parseInt(localStorage.getItem('snake-level-progress'), 10) || 1; } catch(e) {}
      if (savedLevel > LEVELS.length) savedLevel = 1;
      currentLevel = savedLevel;
      score = 0;
      levelStartScore = 0;
      gameTime = 0;
      deathCount = 0;
      obstacles = LEVELS[0].obstacles;
      speed = LEVELS[0].speed;
      levelTransition = false;
      levelOverlay.classList.remove('active');
      victoryOverlay.classList.remove('active');
      leaderboardOverlay.classList.remove('active');
      overlay.classList.remove('active');
      updateLevelUI();
      reset();
    } else {
      levelBar.classList.remove('visible');
      currentLevel = 1;
      score = 0;
      levelStartScore = 0;
      gameTime = 0;
      deathCount = 0;
      obstacles = [];
      speed = 140;
      levelTransition = false;
      levelOverlay.classList.remove('active');
      victoryOverlay.classList.remove('active');
      leaderboardOverlay.classList.remove('active');
      overlay.classList.remove('active');
      reset();
    }
  }

  modeBtns.forEach(btn => {
    btn.addEventListener('click', () => switchMode(btn.dataset.mode));
  });

  // ── 颜色主题应用 ─────────────────────────────────
  function applyTheme(theme) {
    currentTheme = theme;
    const [hr, hg, hb] = theme.head;
    const [glowR, glowG, glowB] = theme.glow;

    const titleEl = document.querySelector('.title');
    titleEl.style.background = `linear-gradient(135deg, rgb(${hr},${hg},${hb}), rgb(${glowR},${glowG},${glowB}))`;
    titleEl.style.webkitBackgroundClip = 'text';
    titleEl.style.backgroundClip = 'text';

    lengthEl.style.color = `rgb(${hr},${hg},${hb})`;

    const btn = document.getElementById('restartBtn');
    btn.style.background = `linear-gradient(135deg, rgb(${hr},${hg},${hb}), rgb(${glowR},${glowG},${glowB}))`;

    document.querySelectorAll('.color-dot').forEach(dot => {
      const isActive = dot.dataset.theme === theme.name;
      dot.classList.toggle('active', isActive);
    });

    try { localStorage.setItem('snake-color-theme', theme.name); } catch(e) {}
  }

  function buildColorPicker() {
    const container = document.getElementById('colorPicker');
    THEMES.forEach(theme => {
      const dot = document.createElement('span');
      dot.className = 'color-dot';
      dot.dataset.theme = theme.name;
      dot.title = theme.label;
      dot.style.backgroundColor = `rgb(${theme.head.join(',')})`;
      dot.style.color = `rgb(${theme.glow.join(',')})`;
      dot.addEventListener('click', () => applyTheme(theme));
      container.appendChild(dot);
    });
    applyTheme(currentTheme);
  }

  // ── 时长格式化 ───────────────────────────────────
  function formatDuration(ms) {
    const totalSec = Math.floor(ms / 1000);
    const hours = Math.floor(totalSec / 3600);
    const minutes = Math.floor((totalSec % 3600) / 60);
    const seconds = totalSec % 60;
    if (hours > 0) return hours + '时' + minutes + '分' + seconds + '秒';
    if (minutes > 0) return minutes + '分' + seconds + '秒';
    return seconds + '秒';
  }

  // ── 排行榜数据管理 ────────────────────────────────
  function getLeaderboard() {
    try {
      return JSON.parse(localStorage.getItem('snake-leaderboard') || '[]');
    } catch(e) { return []; }
  }

  function saveToLeaderboard(nickname, duration, deaths) {
    const data = getLeaderboard();
    data.push({
      nickname: nickname,
      duration: duration,
      deaths: deaths,
      date: new Date().toISOString()
    });
    data.sort((a, b) => a.duration - b.duration);
    try { localStorage.setItem('snake-leaderboard', JSON.stringify(data)); } catch(e) {}
    return data;
  }

  function renderLeaderboard() {
    const data = getLeaderboard();
    lbTbody.innerHTML = '';

    if (data.length === 0) {
      lbEmpty.style.display = 'block';
      return;
    }
    lbEmpty.style.display = 'none';

    data.forEach((entry, i) => {
      const rank = i + 1;
      const tr = document.createElement('tr');
      let rankClass = '';
      if (rank === 1) rankClass = 'rank-1';
      else if (rank === 2) rankClass = 'rank-2';
      else if (rank === 3) rankClass = 'rank-3';
      if (rankClass) tr.className = rankClass;

      let dateStr = '';
      try {
        const d = new Date(entry.date);
        dateStr = (d.getMonth()+1) + '/' + d.getDate();
      } catch(e) { dateStr = '-'; }

      tr.innerHTML =
        '<td class="lb-col-rank">' + rank + '</td>' +
        '<td class="lb-col-name">' + escapeHtml(entry.nickname) + ' <span style="font-size:9px;color:#555">' + dateStr + '</span></td>' +
        '<td class="lb-col-time">' + formatDuration(entry.duration) + '</td>' +
        '<td class="lb-col-deaths">' + entry.deaths + '</td>';
      lbTbody.appendChild(tr);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function showLeaderboard() {
    renderLeaderboard();
    leaderboardOverlay.classList.add('active');
  }

  function hideLeaderboard() {
    leaderboardOverlay.classList.remove('active');
  }

  // ── 胜利弹窗事件 ──────────────────────────────────
  victorySubmitBtn.addEventListener('click', () => {
    let nickname = victoryNickname.value.trim();
    if (!nickname) nickname = '匿名玩家';
    saveToLeaderboard(nickname, gameTime, deathCount);
    victorySubmitBtn.textContent = '✅ 已提交';
    victorySubmitBtn.disabled = true;
    setTimeout(() => {
      victorySubmitBtn.textContent = '📋 提交记录';
      victorySubmitBtn.disabled = false;
    }, 2000);
  });

  victoryLeaderboardBtn.addEventListener('click', () => {
    showLeaderboard();
  });

  victoryRetryBtn.addEventListener('click', () => {
    victoryOverlay.classList.remove('active');
    leaderboardOverlay.classList.remove('active');
    score = 0;
    levelStartScore = 0;
    gameTime = 0;
    deathCount = 0;
    currentLevel = 1;
    try { localStorage.setItem('snake-level-progress', '1'); } catch(e) {}
    scoreEl.textContent = '0';
    reset();
  });

  // ── 排行榜弹窗事件 ────────────────────────────────
  lbCloseBtn.addEventListener('click', hideLeaderboard);
  leaderboardBtn.addEventListener('click', showLeaderboard);

  // ── 屏幕自适应 ──────────────────────────────────
  function fitToScreen() {
    const wrapper = document.getElementById('gameWrapper');
    const header = document.querySelector('.header');
    const colorPicker = document.getElementById('colorPicker');
    const levelBarEl = document.getElementById('levelBar');
    const keyControls = document.getElementById('keyControls');
    const dpadEl = document.getElementById('dpad');

    const wrapperStyle = getComputedStyle(wrapper);
    const wrapperPadH = parseFloat(wrapperStyle.paddingLeft) + parseFloat(wrapperStyle.paddingRight);
    const availW = wrapper.clientWidth - wrapperPadH;

    let usedV = 0;
    usedV += header.offsetHeight;
    usedV += colorPicker.offsetHeight;
    if (levelBarEl.classList.contains('visible')) {
      usedV += levelBarEl.offsetHeight;
    }
    if (isTouchDevice) {
      if (dpadEl.offsetHeight > 0) usedV += dpadEl.offsetHeight;
    } else {
      if (keyControls.offsetHeight > 0) usedV += keyControls.offsetHeight;
    }
    usedV += wrapperPadH;
    const wrapperBorderV = parseFloat(wrapperStyle.borderTopWidth || 0) + parseFloat(wrapperStyle.borderBottomWidth || 0);
    usedV += wrapperBorderV;
    usedV += isTouchDevice ? 12 : 20;

    const availH = window.innerHeight - usedV;

    const maxCell = 24;
    const minCell = 8;

    let newCell = Math.min(maxCell,
      Math.floor(availW / COLS),
      Math.floor(availH / ROWS)
    );
    newCell = Math.max(minCell, newCell);

    if (newCell !== CELL) {
      CELL = newCell;
      applyCanvasSize();
    }
  }

  let resizeTimeout;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(fitToScreen, 150);
  });

  window.addEventListener('orientationchange', () => {
    setTimeout(fitToScreen, 300);
  });

  // ── 全局滚动防护 ────────────────────────────────
  document.addEventListener('touchmove', function(e) {
    if (e.target.closest('.lb-table-wrap')) return;
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('dblclick', function(e) {
    e.preventDefault();
  }, { passive: false });

  // ── 启动 ─────────────────────────────────────────
  function init() {
    fitToScreen();
    createBgParticles();
    buildColorPicker();
    bestEl.textContent = highScore;
    reset();
    lastTime = 0;
    requestAnimationFrame(gameLoop);
  }

  init();
})();
</script>
</body>
</html>
